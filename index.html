<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Edge Deployment Wiki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --red:#E0202C;
  --red-dim:#c31a25;
  --ink:#161A20;
  --ink-soft:#4A525C;
  --line:#DDE1E6;
  --line-soft:#EAEDF0;
  --paper:#FFFFFF;
  --canvas:#F5F6F7;
  --code-bg:#161A20;
  --code-ink:#E7E9EC;
  --tag-bg:#F0F1F3;
  --nav-active:#FDEBEC;
  --shadow:0 1px 2px rgba(20,22,26,.06);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --ink:#EDEFF2;
    --ink-soft:#B4BAC2;
    --line:#2B2F36;
    --line-soft:#23262C;
    --paper:#181B20;
    --canvas:#101216;
    --code-bg:#0B0D10;
    --code-ink:#E7E9EC;
    --tag-bg:#22262C;
    --nav-active:#3A1418;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEFF2;
  --ink-soft:#B4BAC2;
  --line:#2B2F36;
  --line-soft:#23262C;
  --paper:#181B20;
  --canvas:#101216;
  --code-bg:#0B0D10;
  --code-ink:#E7E9EC;
  --tag-bg:#22262C;
  --nav-active:#3A1418;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.logo{font-family:"Space Grotesk",system-ui,sans-serif;}
code,pre,.kbd,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;}

/* ---------- Top header ---------- */
:root{ --hh:58px; }
.tophead{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:50;
  height:var(--hh); background:var(--paper); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:6px; padding:0 16px;
}
.brand{display:flex;align-items:center;gap:9px;flex:none;cursor:pointer;}
.brand .mark{width:24px;height:24px;flex:none;object-fit:contain;}
.brand b{font-size:15px;font-weight:700;letter-spacing:.01em;white-space:nowrap;}
.headspacer{flex:1;}
.hsearch{position:relative;width:min(360px,40vw);flex:none;}
.hsearch input{
  width:100%;padding:8px 60px 8px 34px;border-radius:8px;border:1px solid var(--line);
  background:var(--canvas);color:var(--ink);font-size:13.5px;font-family:inherit;
}
.hsearch input:focus{outline:2px solid var(--red);outline-offset:1px;}
.hsearch svg.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--ink-soft);}
.hsearch .kbdhint{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:3px;}
.hsearch .kbdhint kbd{
  font-family:"IBM Plex Mono",monospace;font-size:10px;background:var(--tag-bg);border:1px solid var(--line);
  border-radius:4px;padding:2px 5px;color:var(--ink-soft);line-height:1.3;
}
.hsearch .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:17px;line-height:1;padding:3px;display:none;}
.hsearch.has-val .kbdhint{display:none;}
.hsearch.has-val .clear{display:block;}
#results{
  position:absolute; left:0; right:0; top:calc(100% + 6px);
  display:none;border:1px solid var(--line);border-radius:10px;background:var(--paper);
  max-height:60vh;overflow-y:auto;box-shadow:0 8px 24px rgba(20,22,26,.14);
}
#results.show{display:block;}
#results .rline{display:block;width:100%;text-align:left;background:none;border:none;padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;border-bottom:1px solid var(--line-soft);font-family:inherit;}
#results .rline:last-child{border-bottom:none;}
#results .rline:hover{background:var(--tag-bg);}
#results .rline .book{display:inline-block;font-size:10px;font-weight:600;color:var(--red-dim);background:var(--nav-active);border-radius:4px;padding:1px 5px;margin-right:5px;}
#results .rline .path{display:block;font-size:11px;color:var(--ink-soft);margin-top:3px;}
#results .none{padding:12px;font-size:13px;color:var(--ink-soft);}
.menuBtnWrap{display:none;flex:none;}
.menuBtnWrap button, .collapseBtn{background:none;border:1px solid var(--line);border-radius:8px;width:32px;height:32px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.menuBtnWrap button svg{width:16px;height:16px;}
@media (max-width:860px){
  .menuBtnWrap{display:flex;}
  .brand b{display:none;}
  .hsearch{width:auto;flex:1;min-width:0;}
  .hsearch .kbdhint{display:none;}
}

/* ---------- Shell ---------- */
.shell{ display:grid; grid-template-columns:272px 1fr; min-height:calc(100vh - var(--hh)); }
@media (max-width:860px){ .shell{grid-template-columns:1fr;} }
body.sidebar-collapsed .shell{grid-template-columns:0 1fr;}

/* ---------- Sidebar ---------- */
.sidebar{
  border-right:1px solid var(--line);
  background:var(--paper);
  position:sticky; top:var(--hh); top:calc(env(safe-area-inset-top,0px) + var(--hh));
  height:calc(100vh - var(--hh)); overflow-y:auto;
  padding:16px 12px 16px;
  display:flex;flex-direction:column;
}
@media (max-width:860px){
  .sidebar{
    position:fixed; inset:var(--hh) 18% 0 0; z-index:40; height:calc(100dvh - var(--hh));
    transform:translateX(-105%); transition:transform .22s ease; top:var(--hh);
  }
  .sidebar.open{transform:translateX(0);}
}
body.sidebar-collapsed .sidebar{display:none;}
@media (max-width:860px){ body.sidebar-collapsed .sidebar{display:flex;} }

.sidebar-scroll{flex:1;overflow-y:auto;margin:0 -2px;padding:0 2px;}
.doclabel{
  font-size:11px;font-weight:600;color:var(--ink-soft);letter-spacing:.03em;
  padding:16px 10px 6px;
}
.docsection:first-child .doclabel{padding-top:2px;}

.navitem{border-radius:7px;}
.navitem>.itemhead{
  display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:7px;
  font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;user-select:none;
}
.navitem>.itemhead:hover{background:var(--tag-bg);}
.navitem>.itemhead .chev{width:13px;height:13px;flex:none;stroke:var(--ink-soft);transition:transform .16s ease;transform:rotate(90deg);}
.navitem.collapsed>.itemhead .chev{transform:rotate(0deg);}
.itembody{overflow:hidden;max-height:2000px;transition:max-height .18s ease;padding-left:14px;}
.navitem.collapsed .itembody{max-height:0;}
.navlink{display:block;padding:6px 10px;border-radius:7px;font-size:13px;color:var(--ink-soft);text-decoration:none;line-height:1.35;cursor:pointer;border-left:2px solid transparent;}
.navlink:hover{background:var(--tag-bg);color:var(--ink);}
.navlink.active{background:var(--nav-active);color:var(--red-dim);font-weight:600;border-left:2px solid var(--red);}

.sidebar-foot{flex:none;border-top:1px solid var(--line-soft);padding-top:10px;margin-top:8px;}
.collapseBtn{width:auto;height:auto;padding:7px 10px;gap:6px;font-size:13px;font-weight:600;color:var(--ink-soft);border:none;}
.collapseBtn:hover{background:var(--tag-bg);color:var(--ink);}
.collapseBtn svg{width:14px;height:14px;stroke:currentColor;}
@media (max-width:860px){ .sidebar-foot{display:none;} }

.expandTab{
  display:none;position:fixed;left:0;top:calc(var(--hh) + 14px);z-index:20;
  background:var(--paper);border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;
  padding:8px 6px;cursor:pointer;color:var(--ink-soft);
}
.expandTab svg{width:14px;height:14px;display:block;}
body.sidebar-collapsed .expandTab{display:block;}
@media (max-width:860px){ .expandTab{display:none !important;} }

.scrim{display:none;position:fixed;inset:0;background:rgba(10,10,12,.4);z-index:35;}
.scrim.show{display:block;}

/* ---------- Content ---------- */
main{padding:44px clamp(20px,5vw,72px) 100px;max-width:880px;}
.crumb{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.crumb b{color:var(--ink);font-weight:500;}
.page{display:none;}
.page.active{display:block;}
.page h1{font-size:29px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em;}
.dek{color:var(--ink-soft);font-size:15px;margin:0 0 30px;max-width:62ch;}
.page h2{font-size:19px;font-weight:600;margin:38px 0 12px;padding-top:6px;}
.page h2:first-of-type{margin-top:8px;}
.page h3{font-size:15.5px;font-weight:600;margin:24px 0 10px;color:var(--ink);}
.page h4{font-size:13.5px;font-weight:600;margin:18px 0 8px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
.page p{line-height:1.65;font-size:14.5px;margin:0 0 14px;max-width:70ch;color:var(--ink);}
.page ul,.page ol{line-height:1.7;font-size:14.5px;padding-left:22px;margin:0 0 16px;max-width:68ch;}
.page li{margin-bottom:4px;}
.page li>ul,.page li>ol{margin-top:6px;margin-bottom:6px;}
.page strong{font-weight:600;}
a.inline{color:var(--red-dim);text-decoration:underline;text-underline-offset:2px;cursor:pointer;}

.diagramwrap{border:1px solid var(--line);border-radius:12px;padding:10px;margin:0 0 8px;background:var(--canvas);overflow-x:auto;}
.archsvg{width:100%;height:auto;min-width:560px;display:block;}
.figcap{font-size:12.5px !important;color:var(--ink-soft);margin:0 0 20px !important;}

.tblwrap{overflow-x:auto;margin:0 0 20px;border:1px solid var(--line);border-radius:10px;}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:420px;}
th{text-align:left;background:var(--tag-bg);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;color:var(--ink);}
tr:last-child td{border-bottom:none;}
td code,th code{font-size:12px;}
.tblwrap.compact table{min-width:0;}
.tblwrap.compact td,.tblwrap.compact th{padding:7px 10px;font-size:13px;}

pre{background:var(--code-bg);color:var(--code-ink);border-radius:10px;padding:14px 16px;overflow-x:auto;font-size:13px;line-height:1.6;margin:0 0 18px;position:relative;}
pre .lbl{position:absolute;top:8px;right:44px;font-size:10.5px;color:#8B93A0;font-family:"IBM Plex Mono",monospace;letter-spacing:.03em;}
.copybtn{position:absolute;top:8px;right:10px;background:#252932;border:1px solid #383D46;color:#C7CCD3;font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer;font-family:"IBM Plex Sans",sans-serif;}
.copybtn:hover{background:#2E333C;}
:not(pre)>code{background:var(--tag-bg);padding:1.5px 5px;border-radius:4px;font-size:12.5px;}

.callout{border-radius:10px;padding:13px 16px;margin:0 0 18px;font-size:13.5px;line-height:1.6;border:1px solid var(--line);border-left-width:3px;max-width:70ch;}
.callout p,.callout ul{margin:0;max-width:none;}
.callout .ctitle{font-weight:600;font-size:12px;letter-spacing:.02em;margin-bottom:4px;display:block;}
.callout.note{border-left-color:#5B7FDB;background:rgba(91,127,219,.08);}
.callout.note .ctitle{color:#5B7FDB;}
.callout.important{border-left-color:var(--red);background:rgba(224,32,44,.07);}
.callout.important .ctitle{color:var(--red-dim);}
.callout.gate{border-left-color:#1F1F1F;background:var(--tag-bg);}
.callout.gate .ctitle{color:var(--ink);}
.callout.success{border-left-color:#2E9E5B;background:rgba(46,158,91,.09);}
.callout.success .ctitle{color:#237A46;}
.callout.link{border-left-color:#8A5CC7;background:rgba(138,92,199,.08);}
.callout.link .ctitle{color:#7A4DB8;}
.callout.link a.inline{font-weight:600;}

.stepgrid{display:flex;flex-direction:column;gap:0;margin:0 0 20px;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.step{display:grid;grid-template-columns:70px 1fr;border-bottom:1px solid var(--line-soft);}
.step:last-child{border-bottom:none;}
.step .n{background:var(--tag-bg);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12.5px;color:var(--ink-soft);font-family:"IBM Plex Mono",monospace;}
.step .body{padding:12px 14px;}
.step .body b{display:block;font-size:13.5px;margin-bottom:2px;}
.step .body span{font-size:13px;color:var(--ink-soft);line-height:1.5;}

.pillrow{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px;}
.pill{background:var(--tag-bg);border:1px solid var(--line);padding:4px 10px;border-radius:100px;font-size:12px;color:var(--ink-soft);}

.heroRow{display:flex;align-items:center;gap:36px;margin-bottom:30px;}
.heroRow h1{font-size:36px;line-height:1.15;margin:0 0 10px;letter-spacing:-.01em;}
.heroRow .sub{color:var(--ink-soft);font-size:15.5px;line-height:1.6;max-width:58ch;margin:0;}
.heroRow .hgraphic{flex:none;width:110px;height:110px;border-radius:16px;background:var(--nav-active);display:flex;align-items:center;justify-content:center;}
.heroRow .hgraphic img,.heroRow .hgraphic svg{width:52px;height:52px;object-fit:contain;}
@media (max-width:640px){.heroRow{flex-direction:column;align-items:flex-start;} .heroRow .hgraphic{display:none;}}

.banner{display:flex;border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:40px;background:var(--paper);}
.banner .bmain{flex:1;min-width:0;padding:26px 28px;}
.banner .bmain h2{margin:0 0 14px !important;font-size:18.5px;}
.banner .bmain ul{margin:0;padding-left:20px;max-width:none;}
.banner .bmain li{margin-bottom:9px;font-size:14.5px;line-height:1.6;}
.banner .bside{flex:none;width:160px;background:var(--nav-active);display:flex;align-items:center;justify-content:center;}
.banner .bside img,.banner .bside svg{width:64px;height:64px;object-fit:contain;}
@media (max-width:700px){.banner{flex-direction:column;} .banner .bside{width:100%;height:90px;}}

.popular h2{margin-top:0 !important;}
.cardgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:12px;}
@media (max-width:760px){.cardgrid{grid-template-columns:1fr;}}
.pcard{border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .15s ease;background:var(--paper);}
.pcard:hover{border-color:var(--red);}
.pcard b{display:block;font-size:14px;margin-bottom:6px;color:var(--ink);}
.pcard p{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px !important;line-height:1.55;max-width:none;}
.pcard .tag{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-soft);}
.pcard .tag svg{width:13px;height:13px;flex:none;stroke:var(--ink-soft);}

.pager{display:flex;justify-content:space-between;gap:14px;margin-top:48px;padding-top:20px;border-top:1px solid var(--line);}
.pager a{flex:1;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;cursor:pointer;max-width:48%;}
.pager a:hover{background:var(--tag-bg);}
.pager a .dir{color:var(--ink-soft);font-size:11px;display:block;margin-bottom:3px;}
.pager a.next{text-align:right;}
mark{background:#FDE68A;color:#161A20;border-radius:2px;padding:0 1px;}

::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>
