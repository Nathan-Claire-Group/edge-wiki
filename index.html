{book:'install', group:"Overview", id:"welcome", title:"Welcome & What's New", dek:"GitHub-based deployment replaces manual file transfer for Edge Enterprise Performance Monitoring.", html:`
<h2>GitHub-based deployment</h2>
<p>Clients connect to NCG Africa's private repositories and deploy Edge directly — no manual transfer of application files. This guide covers firewall whitelisting, UAT and production setup, component installation, updates, and rollback.</p>
<p>Each module is presented with Windows instructions, with Linux equivalents where supported.</p>
<h2>What's changed</h2>
<p>Previous Edge deployments required NCG Africa to ship the full application files to each client and install them by hand. From this release, clients deploy Edge directly from NCG Africa's private GitHub repositories. The client's servers clone the code, and a single installer wires up Git, Python, the Windows services, and the dashboard.</p>
<p>This delivers faster deployments, consistent versions, and simple updates — future versions are applied with a Git pull instead of a fresh hand-off.</p>
<h2>What this means for your servers</h2>
<ul>
<li>Servers need scoped <strong>outbound</strong> HTTPS access to a short list of endpoints (see <a class="inline" data-goto="install:firewall">Firewall Whitelist</a>). No inbound connections to servers are required.</li>
<li>Git and Python install from offline installers bundled in the deployment package — the machine needs no general internet access, only the whitelisted endpoints during the clone and dependency steps.</li>
</ul>
<div class="callout link"><span class="ctitle">Related documents</span>This guide points to the <a class="inline" data-goto="trd:trd-purpose">Technical Requirements Document</a> for hardware sizing and full port mappings, and to the <a class="inline" data-goto="ssl:ssl-overview">SSL/TLS Certificate Setup Guide</a> for the domain and certificate step.</div>
`},
{book:'install', group:"Overview", id:"repos", title:"The Two Edge Repositories", dek:"Edge is delivered as two private GitHub repositories, plus a database package delivered separately.", html:`
<p>Edge is delivered as two private repositories under the <strong>NCG-Africa</strong> GitHub organisation. The installer clones the ones each server role needs.</p>
<div class="tblwrap"><table>
<tr><th>Repository</th><th>Clone target</th><th>Purpose</th></tr>
<tr><td><code>NCG-Africa/edge_platform</code></td><td><code>C:\\EDGE-PLATFORM</code></td><td>Backend microservices, Gateway (Nginx), Dashboard UI, WinSW service definitions</td></tr>
<tr><td><code>NCG-Africa/edge-synthetic-runner</code></td><td><code>C:\\EDGE-SYNTHETIC-RUNNER</code></td><td>Synthetic checks / test-workflow runner</td></tr>
</table></div>
<h2>Access scope</h2>
<p>These are private repositories. Whitelisting GitHub for the clone does not grant access to their contents — access is controlled by credentials embedded in the installer. Whitelisting only permits the network connection.</p>
<div class="callout important"><span class="ctitle">Database is not on GitHub</span>The Edge database package (<code>NCG-Africa/edge_platform_database</code>) is <strong>not</strong> cloned from GitHub. It is delivered directly by NCG Africa via secure file share and placed on the database server before installation.</div>
`},
{book:'install', group:"Before You Begin", id:"prereq-check", title:"Prerequisites Checklist", dek:"Mandatory checks for both UAT and production, before touching any Edge component.", html:`
<div class="callout important"><span class="ctitle">Read the TRD first</span>Review the <a class="inline" data-goto="trd:trd-purpose">Edge Technical Requirements Document</a> in full before installing anything. It is the authoritative source for supported operating systems, hardware sizing, port mappings, and network/firewall requirements. Installation must not proceed without validating all requirements defined there.</div>
<h2>Administrative privileges</h2>
<ul>
<li>Windows servers: <strong>Local Administrator</strong> privileges required.</li>
<li>Linux servers (RUM / Synthetic / Agent): <strong>sudo/root</strong> access required.</li>
</ul>
<h2>Before installing the Gateway/UI Server</h2>
<ul>
<li>Confirm a valid SSL/TLS certificate has been issued — see the <a class="inline" data-goto="ssl:ssl-overview">SSL/TLS Certificate Setup Guide</a>.</li>
<li>Confirm the certificate matches the assigned domain name.</li>
<li>Confirm certificate chain trust is available on the server.</li>
</ul>
<div class="callout important"><span class="ctitle">Gate</span>Installation must not proceed without verified administrative rights.</div>
<div class="callout note"><span class="ctitle">Production only</span>Gateway tenant URL configuration must be updated in <code>C:\\EDGE-PLATFORM\\gateway\\conf\\edge-gateway.prod.https.conf</code> — not the dev file.</div>
`},
{book:'install', group:"Before You Begin", id:"os-hw", title:"Operating System & Hardware", dek:"Supported OS per component, and hardware sizing for the full production target.", html:`
<h2>Operating system requirements</h2>
<div class="tblwrap"><table>
<tr><th>Server component</th><th>Supporting OS</th></tr>
<tr><td>Gateway/UI Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Edge Services Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Database Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Edge Agent Host</td><td>Windows or Linux</td></tr>
<tr><td>Edge RUM / Synthetic Server</td><td>Linux (enterprise distribution recommended)</td></tr>
</table></div>
<h2>Hardware requirements (Windows servers)</h2>
<div class="tblwrap"><table>
<tr><th>Component</th><th>CPU</th><th>Memory</th><th>Disk</th></tr>
<tr><td>Gateway/UI Server</td><td>8 vCPU min</td><td>16 GB RAM min</td><td>400–500 GB SSD</td></tr>
<tr><td>Edge Services Server</td><td>8 vCPU min</td><td>16 GB RAM min</td><td>400–500 GB SSD</td></tr>
<tr><td>Database Server</td><td>8 vCPU min</td><td>32 GB RAM min</td><td>400–500 GB SSD</td></tr>
</table></div>
<p>Validate against expected telemetry volume and client database size, in line with the Edge TRD.</p>
<div class="callout note"><span class="ctitle">Installer minimums vs. production sizing</span>The installer itself requires only Windows Server 2016 / 2019 / 2022 (64-bit), 8 GB RAM minimum, and approximately 20 GB free on <code>C:\\</code>. The sizing table above is the full production target per the Edge TRD, not the installer's own footprint. See the <a class="inline" data-goto="trd:trd-gateway">TRD's full sizing tables</a> for Small/Medium/Large tiers.</div>
`},
{book:'install', group:"Before You Begin", id:"sw-req", title:"Software Requirements (Windows)", dek:"What must already be on the box, and what the installer brings with it.", html:`
<ul>
<li>Windows Server 2019 or later</li>
<li>.NET runtime (if required by service wrappers)</li>
<li>PowerShell (default on Windows Server)</li>
<li>Service Control Manager access</li>
<li>Git (installed by the deployment package if not present)</li>
</ul>
<h2>Python clarification</h2>
<p>No manual Python installation is required. The deployment package includes an offline Python 3 installer, and the Edge backend packages its required Python binaries and dependencies. Administrators do not need to install Python separately on Edge Services Servers.</p>
`},
{book:'install', group:"Before You Begin", id:"git-longpath", title:"Git Long-Path Support", dek:"Required before cloning — without it, the clone silently drops nested files.", html:`
<div class="callout important"><span class="ctitle">Why this matters</span>Windows enforces a legacy 260-character path limit. The <code>edge_platform</code> repository bundles the OpenTelemetry .NET instrumentation store, whose nested paths exceed this limit. Without the fix below, <code>git clone</code> appears to succeed but silently fails to check out those files.</div>
<h3>Enable long paths in Git (run once, any terminal)</h3>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>git config --global core.longpaths true
git config --global core.longpaths  :: verify → true</pre>
<h3>Enable long paths in Windows (Administrator)</h3>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>reg add "HKLM\\SYSTEM\\CurrentControlSet\\Control\\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f</pre>
<p>A helper script that applies both settings is provided at <code>scripts\\setup-git-windows.bat</code> — run it as Administrator. The registry change may require a reboot.</p>
<div class="callout note"><span class="ctitle">Linux &amp; macOS</span>Unaffected by this limitation.</div>
`},
{book:'install', group:"Before You Begin", id:"pkg-contents", title:"Deployment Package Contents", dek:"What NCG Africa provides to bootstrap each Windows server.", html:`
<p>NCG Africa provides a small package to bootstrap each Windows server. It contains the offline runtimes and the installer that performs the clone and service setup.</p>
<div class="tblwrap"><table>
<tr><th>File / folder</th><th>Description</th></tr>
<tr><td><code>install.bat</code></td><td>Entry point — double-click to start. Auto-elevates to Administrator.</td></tr>
<tr><td><code>edge-platform-installer.exe</code></td><td>Main installer. Runs the sequential setup steps. Repository credentials are embedded.</td></tr>
<tr><td><code>Gitapp\\</code></td><td>Offline Git installer (.exe).</td></tr>
<tr><td><code>Pythonapp\\</code></td><td>Offline Python 3 installer (.exe).</td></tr>
</table></div>
<div class="callout success"><span class="ctitle">Offline by design</span>The package itself needs no internet access. Internet is only required during the repository clone and dependency steps — and only to the whitelisted endpoints.</div>
`},
{book:'install', group:"Before You Begin", id:"personnel", title:"Personnel Required (Deployment Day)", dek:"Who needs to be available while the installer runs.", html:`
<ul>
<li><strong>NCG Africa deployment engineer</strong> — executes the installer and runs validation.</li>
<li><strong>Client IT / infrastructure representative</strong> — provides server access and approves the UAC prompt.</li>
<li><strong>Client network / firewall administrator</strong> — confirms the whitelist entries are active.</li>
</ul>
`},
{book:'install', group:"Network & Firewall", id:"firewall", title:"Firewall Whitelist Configuration", dek:"Outbound-only HTTPS access, scoped to the Edge App and Gateway servers.", html:`
<p>Configure the following outbound HTTPS (port 443) access on the <strong>Edge App and Edge UI/Gateway servers only</strong>. All connections are outbound — the servers initiate requests; no inbound rules are required. Keep these entries active after the initial deployment so future updates apply without manual file transfers.</p>
<h2>Required — code &amp; repositories (GitHub)</h2>
<div class="tblwrap"><table>
<tr><th>Endpoint</th><th>Purpose</th></tr>
<tr><td><code>github.com/NCG-Africa/EDGE-PLATFORM</code></td><td>Clone the Edge Platform repository (private)</td></tr>
<tr><td><code>github.com/NCG-Africa/edge-synthetic-runner</code></td><td>Clone the Synthetic Runner repository (private)</td></tr>
<tr><td><code>objects.githubusercontent.com</code></td><td>GitHub content delivery network — required for the clone to complete</td></tr>
</table></div>
<div class="callout important"><span class="ctitle">Important</span>The first two entries are specific to NCG Africa's private repositories only and do not grant access to any other content on GitHub. The third entry is GitHub's CDN and is required alongside the repository URLs — without it, the clone will fail even if the repository URLs are whitelisted.</div>
<ul>
<li>All connections are outbound only; no inbound connections are required.</li>
<li>Port 443 (HTTPS) only.</li>
<li>Scoped to the Edge App and Edge UI/Gateway servers only — no other servers require these changes.</li>
<li>Once initial deployment is complete, these entries should remain active to allow future periodic updates without manual file transfers.</li>
</ul>
<div class="callout note"><span class="ctitle">Standard deployment</span>The three GitHub entries above are the only endpoints required for the standard deployment — Git and Python install from the bundled offline installers. The sections below apply only where language dependencies are fetched online, or where the named optional features are enabled.</div>
<h2>Additional — language runtimes &amp; dependencies (situational)</h2>
<p>Needed only when Python and Node dependencies are installed online during setup or updates. Confirm the exact subset for your release with NCG Africa.</p>
<div class="tblwrap"><table>
<tr><th>Endpoint</th><th>Purpose</th></tr>
<tr><td><code>www.python.org</code></td><td>Python runtime download (if not bundled)</td></tr>
<tr><td><code>pypi.org</code> / <code>pypi.python.org</code></td><td>Python package index (pip)</td></tr>
<tr><td><code>files.pythonhosted.org</code> / <code>pythonhosted.org</code></td><td>Python package file downloads</td></tr>
<tr><td><code>nodejs.org</code></td><td>Node.js runtime (Dashboard build)</td></tr>
<tr><td><code>registry.npmjs.org</code> / <code>npmjs.org</code></td><td>Node package registry (npm)</td></tr>
</table></div>
<h2>Additional — Geo-IP database (RUM / Analytics, situational)</h2>
<div class="tblwrap"><table>
<tr><th>Endpoint</th><th>Purpose</th></tr>
<tr><td><code>download.maxmind.com</code></td><td>MaxMind GeoIP database download</td></tr>
<tr><td><code>updates.maxmind.com</code></td><td>MaxMind GeoIP database updates</td></tr>
<tr><td><code>mm-prod-geoip-databases.…r2.cloudflarestorage.com</code></td><td>MaxMind database CDN (Cloudflare R2)</td></tr>
</table></div>
<h2>Conditional — features that reach external services</h2>
<div class="tblwrap"><table>
<tr><th>Endpoint</th><th>Required when</th></tr>
<tr><td><code>api.openai.com</code></td><td>Ask Edge / AI Insights enabled. If disabled, not required.</td></tr>
<tr><td><code>*.live.dynatrace.com</code></td><td>A Dynatrace integration / migration path is in use.</td></tr>
<tr><td><code>&lt;your-dynatrace-managed-host&gt;</code></td><td>Connecting to a Dynatrace Managed cluster.</td></tr>
<tr><td><code>&lt;your-smtp-host&gt;</code></td><td>Email alerting. Outbound SMTP, typically 587/465 (not 443).</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Placeholders</span>The Dynatrace and SMTP entries are client-specific — substitute the actual hosts, or omit the row if the feature is not used. SMTP uses the mail port (587/465), whitelisted separately from the HTTPS list above.</div>
`},
{book:'install', group:"Network & Firewall", id:"ports", title:"Required Ports", dek:"Internal service ports and how to check availability before installing.", html:`
<div class="tblwrap"><table>
<tr><th>#</th><th>Component</th><th>Port</th><th>Direction</th><th>Purpose</th></tr>
<tr><td>1</td><td>Gateway/UI Server</td><td>443/TCP</td><td>Inbound</td><td>Secure UI access</td></tr>
<tr><td>2</td><td>Gateway/UI ↔ Edge Services</td><td>8081–8087/TCP</td><td>Internal</td><td>Microservice communication</td></tr>
<tr><td>3</td><td>Gateway (Nginx)</td><td>8888/TCP</td><td>Internal</td><td>Gateway entry / routing</td></tr>
<tr><td>4</td><td>Edge Services ↔ Database</td><td>5433/TCP</td><td>Internal</td><td>Database access</td></tr>
<tr><td>5</td><td>Edge Services → SMTP</td><td>587/465</td><td>Outbound</td><td>Email alerts</td></tr>
<tr><td>6</td><td>Gateway/UI ↔ RUM Service</td><td>8003/TCP</td><td>Internal</td><td>RUM ingestion</td></tr>
<tr><td>7</td><td>Admin access</td><td>3389/RDP</td><td>Internal</td><td>Administration</td></tr>
</table></div>
<p>The <a class="inline" data-goto="trd:trd-purpose">Edge Technical Requirements document</a> contains the full per-service port list.</p>
<h2>How to check port availability</h2>
<h3>Windows / cmd</h3>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>netstat -ano | findstr :443
netstat -ano | findstr :8081
netstat -ano | findstr :5433
netstat -ano | findstr :8888</pre>
<h3>Linux (RUM/Synthetic)</h3>
<pre><span class="lbl">bash</span><button class="copybtn" data-copy>Copy</button>netstat -tulnp | grep :8003</pre>
<p>Replace the port number with the specific port being validated. If a required port is already in use, the conflict must be resolved before installation proceeds.</p>
`},
{book:'install', group:"Environments", id:"env-strategy", title:"UAT vs. Production", dek:"Every deployment is validated on UAT before production is approved — the two environments share one install process.", html:`
<p>Every client deployment is validated on a UAT (User Acceptance Testing) server before production is approved. UAT and production share an identical installation process; they differ only in configuration, chiefly the environment file used and the database host.</p>
<div class="tblwrap"><table>
<tr><th>Aspect</th><th>UAT</th><th>Production</th></tr>
<tr><td>Environment file</td><td><code>edge.platform.dev.env</code></td><td><code>edge.platform.prod.env</code></td></tr>
<tr><td>Database host</td><td>Local / UAT DB IP</td><td>Production DB server IP</td></tr>
<tr><td>Dashboard API base</td><td><code>http://localhost:8081</code></td><td><code>https://&lt;gateway_fqdn&gt;</code></td></tr>
<tr><td>SSL / domain</td><td>Optional for testing</td><td>Mandatory before agents</td></tr>
<tr><td>Gateway tenant URL</td><td>Dev config file</td><td><code>edge-gateway.prod.https.conf</code></td></tr>
<tr><td>Approval</td><td>Sign-off gate before prod</td><td>Go / no-go on the day</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Fixed vs. variable</span>Database name, user, password, and port are fixed across both environments and must match the Edge Database installer configuration. Generally only the host value changes between UAT and production.</div>
`},
{book:'install', group:"Environments", id:"install-order", title:"Installation Order", dek:"A strict dependency chain — install out of order and later steps will fail.", html:`
<div class="stepgrid">
<div class="step"><div class="n">1</div><div class="body"><b>Pre-installation checks</b><span>Confirm every item in the Prerequisites Checklist.</span></div></div>
<div class="step"><div class="n">2</div><div class="body"><b>Configure domain and SSL</b><span>Complete the <a class="inline" data-goto="ssl:ssl-overview">SSL/TLS Certificate Setup Guide</a> before the Gateway/UI is installed.</span></div></div>
<div class="step"><div class="n">3</div><div class="body"><b>Edge Database</b><span>Must be installed and running before Edge Services.</span></div></div>
<div class="step"><div class="n">4</div><div class="body"><b>Edge Backend Services</b><span>Must be available before Gateway/UI.</span></div></div>
<div class="step"><div class="n">5</div><div class="body"><b>Edge Dashboard Service</b><span>Required before the Synthetic Runner.</span></div></div>
<div class="step"><div class="n">6</div><div class="body"><b>Edge Synthetic Runner</b><span>Requires an API key generated from the UI.</span></div></div>
<div class="step"><div class="n">7</div><div class="body"><b>Edge Agents</b><span>Installed only after Gateway/UI is configured with domain + SSL.</span></div></div>
</div>
<div class="callout important"><span class="ctitle">Dependency rule</span>Edge Database before Edge Services; Edge Services before Gateway/UI; Gateway/UI configured with domain + SSL before Edge Agents.</div>
`},
{book:'install', group:"Environments", id:"prestart", title:"Final Pre-Start Checklist", dek:"Confirm every item before starting the installer.", html:`
<ul>
<li>All required ports validated</li>
<li>SSL installed and verified — see the <a class="inline" data-goto="ssl:ssl-checklist">SSL Guide's own pre-start checklist</a></li>
<li>Database reachable from Edge Services</li>
<li>Services installed with admin rights</li>
<li>Internet / whitelisting validated</li>
<li>RUNBOOK for each component reviewed</li>
</ul>
`},
{book:'install', group:"Environments", id:"linux-req", title:"Linux Server Requirements", dek:"Mandatory baseline for RUM/Synthetic and Agent hosts running Linux.", html:`
<div class="tblwrap"><table>
<tr><th>Category</th><th>Requirement</th></tr>
<tr><td>Applicable components</td><td>Edge RUM / Synthetic Server, Edge Agent hosts, any Linux-based supporting services</td></tr>
<tr><td>Supported distributions</td><td>RHEL 8+, Rocky Linux 8+, AlmaLinux 8+, Ubuntu Server 20.04 LTS+</td></tr>
<tr><td>Minimum kernel</td><td>Linux kernel 4.18 or later</td></tr>
<tr><td>Required packages</td><td><code>systemd</code>, <code>curl</code>, <code>openssl</code>, <code>tar</code>, <code>gzip</code>, <code>iproute</code> or <code>net-tools</code></td></tr>
<tr><td>CPU / Memory / Disk</td><td>4 vCPU min / 8 GB RAM min / 100 GB SSD min</td></tr>
</table></div>
`},
{book:'install', group:"UAT Deployment", id:"uat-predeploy", title:"Pre-Deployment Checklist", dek:"Confirm these before running the installer on the UAT server.", html:`
<ul>
<li>Whitelist entries active on the App and UI/Gateway servers.</li>
<li>Local Administrator access confirmed (Windows); sudo/root (Linux).</li>
<li>Git long-path support enabled.</li>
<li>Required ports free.</li>
<li>Deployment package staged on each server.</li>
<li>For the Gateway: valid SSL/TLS certificate matching the domain, chain trust available (production).</li>
</ul>
`},
{book:'install', group:"UAT Deployment", id:"run-installer", title:"Running the Installer", dek:"Seven sequential steps, executed automatically once the installer is launched.", html:`
<ol>
<li>Place the deployment package at <code>C:\\Edge Deployment App\\</code> on the server.</li>
<li>Double-click <code>install.bat</code>. It runs pre-flight checks on all required files and folders. If <code>install.bat</code> is unavailable, run <code>edge-platform-installer.exe</code> with elevated privileges.</li>
<li>Approve the UAC prompt (the script auto-elevates to Administrator).</li>
<li>The installer runs automatically through seven sequential steps:</li>
</ol>
<div class="stepgrid">
<div class="step"><div class="n">1/7</div><div class="body"><b>Git Installation</b><span>Checks for Git. Installs silently from bundled <code>Gitapp\\</code> if missing.</span></div></div>
<div class="step"><div class="n">2/7</div><div class="body"><b>Git Configuration</b><span>Configures Git credentials and enables long-path support.</span></div></div>
<div class="step"><div class="n">3/7</div><div class="body"><b>Clone Edge Platform</b><span>Clones <code>NCG-Africa/edge_platform</code> into <code>C:\\EDGE-PLATFORM</code>.</span></div></div>
<div class="step"><div class="n">4/7</div><div class="body"><b>Clone Synthetic Runner</b><span>Clones <code>NCG-Africa/edge-synthetic-runner</code> into <code>C:\\EDGE-SYNTHETIC-RUNNER</code>.</span></div></div>
<div class="step"><div class="n">5/7</div><div class="body"><b>Python Installation</b><span>Checks for Python 3. Installs silently from bundled <code>Pythonapp\\</code> if missing.</span></div></div>
<div class="step"><div class="n">6/7</div><div class="body"><b>WinSW Services</b><span>Installs all Edge Platform Windows services.</span></div></div>
<div class="step"><div class="n">7/7</div><div class="body"><b>Edge Dashboard Service</b><span>Installs the Edge Dashboard Windows service.</span></div></div>
</div>
<ol start="5">
<li>On success the terminal shows <code>EDGE PLATFORM INSTALLATION COMPLETE</code>.</li>
<li>Events are logged to <code>C:\\Edge Deployment App\\runtime_logs\\[date].log</code>.</li>
</ol>
<div class="callout note"><span class="ctitle">Database note</span>The installer covers the platform and synthetic runner only. The Edge Database is installed separately (see <a class="inline" data-goto="install:db-install">Edge Database Installation</a>) and must be running first.</div>
`},
{book:'install', group:"UAT Deployment", id:"uat-acceptance", title:"UAT Acceptance Criteria (Sign-Off Gate)", dek:"Production cannot proceed without written client sign-off against these criteria.", html:`
<p>The following must be verified and formally signed off before production is approved:</p>
<ul>
<li><strong>Application functionality</strong> — all features tested and operating without defects or regressions.</li>
<li><strong>Requirements compliance</strong> — functional and non-functional requirements (performance, security, availability, scalability, usability) met and validated.</li>
<li><strong>Testing completion</strong> — unit, integration, system, UAT, performance, security, and regression testing completed.</li>
<li><strong>Client sign-off</strong> — the client confirms the solution meets agreed business and technical requirements, with written approval for production.</li>
</ul>
<div class="callout gate"><span class="ctitle">Gate</span>Production deployment will not proceed until all acceptance criteria above are marked PASS and signed off in writing by a named client representative.</div>
`},
{book:'install', group:"Production Deployment", id:"prod-config", title:"Production Configuration Differences", dek:"What changes once UAT is signed off — same installer, production configuration.", html:`
<p>Once UAT acceptance is signed off, production follows the identical installer process with production configuration. The production deployment is scheduled at a mutually agreed time (typically outside business hours), executed by an NCG Africa engineer with a client IT representative present, preceded by a formal go/no-go, and followed by a post-deployment health check.</p>
<ol>
<li>Set <code>EDGE_ENV_FILE</code> to the production file:
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>setx EDGE_ENV_FILE "C:\\EDGE-PLATFORM\\config\\edge.platform.prod.env"</pre>
</li>
<li>In <code>edge.platform.prod.env</code>, set the database host to the production DB server IP.</li>
<li>Configure the Gateway tenant URL in <code>C:\\EDGE-PLATFORM\\gateway\\conf\\edge-gateway.prod.https.conf</code> — see the <a class="inline" data-goto="ssl:step6">SSL guide's Nginx config step</a>.</li>
<li>Point the Dashboard at the Gateway, not a service directly:
<pre><span class="lbl">env</span><button class="copybtn" data-copy>Copy</button>VITE_EDGE_API_BASE_URL=https://&lt;gateway_fqdn&gt;
VITE_BRAND_NAME=EDGE APM</pre>
</li>
<li>Confirm SSL/TLS is installed and the certificate matches the domain before installing any agents.</li>
</ol>
<div class="callout note"><span class="ctitle">Sign-off</span>A separate production sign-off document is completed and retained by both parties following successful deployment.</div>
`},
{book:'install', group:"Component Installation", id:"db-install", title:"1 · Edge Database Installation", dek:"PostgreSQL 18 with TimescaleDB — installed and run on the Database Server as Local Administrator.", html:`
<p>The Edge Database uses PostgreSQL 18 with TimescaleDB. The repository bundles the PostgreSQL installer, the TimescaleDB files, the enterprise DDL, and a one-shot installer script that handles database creation, schema setup, user configuration, and initial setup. Run on the Database Server as Local Administrator.</p>
<h2>Step 1 — Configure environment files</h2>
<p>There are two environment files; only the host value changes between them. In <code>C:\\EDGE-PLATFORM\\config</code> locate <code>edge.platform.dev.env</code> and <code>edge.platform.prod.env</code>.</p>
<pre><span class="lbl">env</span><button class="copybtn" data-copy>Copy</button>EDGE_DB_HOST=127.0.0.1              :: client / local
EDGE_DB_HOST=&lt;production_server_ip&gt; :: production</pre>
<div class="callout note"><span class="ctitle">Fixed parameters — do not change</span>Database name, user, password, and port remain the same for both environments and must match the Edge Database installer configuration.</div>
<h2>Step 2 — Run the installer (as Administrator)</h2>
<p>Confirm port 5433 is free, then run on the Database Server:</p>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\edge_db
install_postgres_edge.cmd</pre>
<p>The script installs PostgreSQL 18 and TimescaleDB, sets port 5433 and the TimescaleDB preload, restarts the service, creates the <code>edge_db</code> database, enables the extension, and deploys the DDL. No manual database creation is required.</p>
<h2>Step 3 — Allow App Server access</h2>
<p>Edit <code>C:\\PostgresData\\pg_hba.conf</code> and add (replace with your App Server subnet):</p>
<pre><span class="lbl">pg_hba.conf</span><button class="copybtn" data-copy>Copy</button>host edge_db postgres 10.180.142.0/24 scram-sha-256</pre>
<p>Then restart the PostgreSQL service from <code>services.msc</code> and confirm it is Running.</p>
<h2>Step 4 — Verify</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>sc query postgresql-x64-18       :: expect STATE : 4 RUNNING
netstat -ano | findstr :5433     :: expect LISTENING</pre>
<div class="callout important"><span class="ctitle">Security — change the default password</span>The bundled installer sets a default superuser password. Change it immediately after installation and update the connection settings in the platform .env file. The database account must have full read/write on <code>edge_db</code>, and the Edge Services Server should be the only component permitted database access.</div>
<h2>Uninstall</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\edge_db
rollback_edge_db.cmd</pre>
<p>Then uninstall PostgreSQL via Windows 'Add or Remove Programs' and delete <code>C:\\PostgresData</code>.</p>
`},
{book:'install', group:"Component Installation", id:"backend-install", title:"2 · Edge Backend (Ingestion & Analytics)", dek:"FastAPI microservices for telemetry ingestion and analytics, each run as an independent Windows Service.", html:`
<p>The backend is a set of FastAPI microservices for telemetry ingestion and analytics (Metrics, Traces, Logs, RUM). Each runs as an independent Windows Service via WinSW.</p>
<h2>Step 1 — Configure the environment file</h2>
<p>Services read config from the path in <code>EDGE_ENV_FILE</code>. Default (dev): <code>C:\\EDGE-PLATFORM\\config\\edge.platform.dev.env</code>.</p>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>setx EDGE_ENV_FILE "C:\\EDGE-PLATFORM\\config\\edge.platform.prod.env"
:: Restart the terminal or service after setting this.</pre>
<h2>Step 2 — Verify the clone</h2>
<p>Confirm <code>C:\\EDGE-PLATFORM</code> contains: <code>winsw-services</code>, <code>ui</code>, <code>gateway</code>, <code>config</code>, <code>services</code>.</p>
<h2>Step 3 — Per-service Python environments (run once each)</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd C:\\EDGE-PLATFORM\\services\\query
python -m venv .venv
.venv\\Scripts\\pip install -r requirements.txt
mkdir runtime_logs
:: repeat for: ingest, control-plane, auth, alerting, ai-insights, agent-distribution</pre>
<h2>Step 4 — Install all services</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd C:\\EDGE-PLATFORM\\winsw-services
install-all-services.cmd</pre>
<div class="tblwrap"><table>
<tr><th>Service</th><th>Port</th><th>Role</th></tr>
<tr><td><code>edge-gateway</code> (Nginx)</td><td>8888</td><td>Public entry point / routing (fronted by 443 HTTPS in production)</td></tr>
<tr><td><code>edge-ingest</code></td><td>8081</td><td>Telemetry ingestion (agent / OTLP / RUM / synthetics)</td></tr>
<tr><td><code>edge-control-plane</code></td><td>8082</td><td>Tenants, environments, users, RBAC, super-admin</td></tr>
<tr><td><code>edge-auth</code></td><td>8083</td><td>Login, JWT issuance, service-to-service auth</td></tr>
<tr><td><code>edge-query</code></td><td>8084</td><td>Dashboard reads, metrics/logs/traces queries, search</td></tr>
<tr><td><code>edge-alerting</code></td><td>8085</td><td>Alert rule evaluation and notifications</td></tr>
<tr><td><code>edge-agent-distribution</code></td><td>8086</td><td>Agent package download and config patching</td></tr>
<tr><td><code>edge-ai-insights</code></td><td>8087</td><td>AI insights / Ask Edge</td></tr>
</table></div>
<h2>Step 5 — Verify service endpoints</h2>
<pre><span class="lbl">browser</span><button class="copybtn" data-copy>Copy</button>http://localhost:8888        :: Gateway
http://localhost:8081/docs  :: Ingest Service
http://localhost:8084/docs  :: Query Service</pre>
<p>If endpoints don't load, check service logs in <code>C:\\EDGE-PLATFORM\\services\\&lt;service&gt;\\runtime_logs\\</code>.</p>
<h2>Uninstall</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd C:\\EDGE-PLATFORM\\winsw-services
uninstall-all-services.cmd</pre>
`},
{book:'install', group:"Component Installation", id:"dashboard-install", title:"3 · Edge Dashboard Service", dek:"React + Vite frontend, deployed as a Windows Service and reached through the Gateway.", html:`
<p>The Edge Dashboard is a React + Vite frontend, deployed as a Windows Service via WinSW. End users reach it through the Gateway over HTTPS. In production it must communicate through the Gateway — which handles routing, authentication, and security boundaries — not directly to microservices. Default service name: <code>EDGEDashboard</code>.</p>
<h2>Step 1 — Configure the Dashboard environment</h2>
<p>Set the API base in the environment file (<code>.env.local</code> for UAT, <code>.env.prod</code> for production):</p>
<pre><span class="lbl">env — local/UAT</span><button class="copybtn" data-copy>Copy</button>VITE_EDGE_API_BASE_URL=http://localhost:8081
VITE_BRAND_NAME=EDGE APM</pre>
<pre><span class="lbl">env — production</span><button class="copybtn" data-copy>Copy</button>VITE_EDGE_API_BASE_URL=https://&lt;gateway_fqdn&gt;
VITE_BRAND_NAME=EDGE APM</pre>
<h2>Step 2 — Install the Dashboard service</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\EDGE-PLATFORM\\ui\\edge_dashboard\\service_setup
call install_edge_dashboard_service.cmd
sc query EDGEDashboard</pre>
<p>Verify the service status is 'Running' in <code>services.msc</code>.</p>
<h2>Step 3 — Accessing the Dashboard (Super Admin)</h2>
<ol>
<li>Open the Super Admin Console URL shown by the installer.</li>
<li>Retrieve credentials from <code>C:\\EDGE-PLATFORM\\config\\edge.platform.&lt;env&gt;.env</code> — values <code>EDGE_SUPER_ADMIN_EMAIL</code> and <code>EDGE_SUPER_ADMIN_PASSWORD</code>.</li>
<li>Enter the credentials and sign in.</li>
</ol>
<h2>Uninstall</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\EDGE-PLATFORM\\ui\\edge_dashboard\\service_setup
cmd /v:on /c "call uninstall_edge_dashboard_service.cmd"</pre>
`},
{book:'install', group:"Component Installation", id:"synthetic-install", title:"4 · Edge Synthetic Runner Service", dek:"Runs synthetic checks against configured targets; each runner represents a logical location.", html:`
<p>The Synthetic Runner runs synthetic checks and test workflows against configured targets. Each runner represents a logical location and registers with the platform using an enrollment key. Runners operate as independent Windows Services and communicate through the Gateway.</p>
<h2>Step 1 — Generate the enrollment key</h2>
<ol>
<li>Log in to the Super Admin Console → Settings → Synthetic Runners.</li>
<li>Click 'Generate API Key' / 'Create Enrollment Key' and copy it.</li>
</ol>
<div class="callout note"><span class="ctitle">Note</span>The key is created in the Super Admin account.</div>
<h2>Step 2 — Configure the environment</h2>
<ol>
<li>Set <code>EDGE_SYNTHETIC_RUNNER_ENROLLMENT_KEY</code> in both <code>edge.platform.dev.env</code> and <code>edge.platform.prod.env</code>.</li>
<li>Replace the key parameter in <code>EDGE-SYNTHETIC-lagos.XML</code> and in <code>config/synthetic-runner.YAML</code>.</li>
</ol>
<p>The default runner location is <code>lagos</code>. If your deployment location differs (e.g. <code>nairobi</code>), update the location in all files that reference 'lagos'. Review the RUNBOOK (<code>EDGE_SYNTHETIC_RUNNER_OPERATIONS_RUNBOOK.md</code>).</p>
<h2>Step 3 — Install as a Windows service (recommended)</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\EDGE-SYNTHETIC-RUNNER\\lagos
install_edge_synthetic_runner_service.cmd</pre>
<p>The installer creates a Python virtual environment, installs dependencies, configures the WinSW definition, registers the service, and starts the runner. Afterwards, restart the Synthetic Runner service and the Edge Ingest service.</p>
<h2>Step 4 — Verify</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>sc query EDGE-SYNTHETIC-lagos</pre>
<p>A running state confirms successful installation. In the Dashboard → Synthetic Runners, confirm the location shows 'Connected' / 'Online'. Logs: <code>C:\\EDGE-SYNTHETIC-RUNNER\\lagos\\runtime_logs</code>.</p>
<div class="callout important"><span class="ctitle">Important</span>Each runner location requires a unique enrollment key. Runners are internal-only and must not be internet-facing. Any environment variable change requires a service restart.</div>
<h2>Rollback</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\EDGE-SYNTHETIC-RUNNER\\lagos
rollback_edge_synthetic_runner_service.cmd</pre>
`},
{book:'install', group:"Component Installation", id:"tenant-mgmt", title:"5 · Access Tenant Management", dek:"Create a tenant to enable multi-tenant isolation once all components are installed.", html:`
<p>After all components are installed and verified, create a tenant to enable multi-tenant isolation. A tenant segregates client data, applies tenant-specific configuration and policies, and controls access, authentication, and feature enablement.</p>
<h2>Create a tenant</h2>
<p>In the Super Admin Console → Tenants → Create New Tenant, provide:</p>
<div class="tblwrap"><table>
<tr><th>Field</th><th>Example</th></tr>
<tr><td>Tenant Name</td><td>Preferred organization name — e.g. NCG</td></tr>
<tr><td>Tenant Slug</td><td>URL-friendly identifier (lowercase, no spaces) — e.g. <code>ncg</code></td></tr>
<tr><td>Admin Email</td><td>Receives tenant credentials — e.g. <code>admin@ncg.com</code></td></tr>
<tr><td>Plan</td><td>Subscription plan (default: Standard)</td></tr>
</table></div>
<p>The admin receives a tenant login URL, username, and temporary password by email.</p>
<div class="callout important"><span class="ctitle">Important</span>Change the temporary password immediately after first login.</div>
`},
{book:'install', group:"Component Installation", id:"agent-install", title:"6 · Edge Agent", dek:"A lightweight, Go-based collector for logs, metrics, and traces, forwarding to the Gateway.", html:`
<p>The Edge Agent is a lightweight, Go-based collector for logs, metrics, and traces, forwarding to the Gateway over outbound HTTPS. Agents are non-internet-facing, authenticate with an Agent API token, and handle log rotation internally. Supported on Windows Server (2019+) and Linux with systemd.</p>
<p>Download the agent package for the OS from the tenant dashboard (Settings / Agent Management).</p>
<h2>Step 1 — Configure the connection</h2>
<p>Edit <code>edge-agent.yaml</code> and point it at the App Server:</p>
<pre><span class="lbl">yaml</span><button class="copybtn" data-copy>Copy</button>backend_url: http://&lt;APP_SERVER_IP&gt;:8081</pre>
<div class="callout important"><span class="ctitle">Important</span>The agent must reach the App Server on port 8081. Verify firewall rules allow this.</div>
<h2>Step 2 — Install (Windows)</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd /d C:\\edge-agent\\scripts
C:\\edge-agent\\scripts\\setup.cmd
sc query edge-agent</pre>
<h2>Step 2 (alt) — Install (Linux, offline installer)</h2>
<pre><span class="lbl">bash</span><button class="copybtn" data-copy>Copy</button>sudo cp -r edge-agent /opt/edge-agent
sudo bash /opt/edge-agent/scripts/install_edge_agent_linux.sh
sudo systemctl status edge-agent --no-pager</pre>
<h2>Verify connectivity</h2>
<p>Confirm the agent shows 'Connected' / 'Active' in the tenant dashboard (Agents / Infrastructure). Windows logs: <code>C:\\edge-agent\\logs\\</code>; Linux logs: <code>/opt/edge-agent/runtime_logs/agent-YYYYMMDD.log</code>.</p>
<div class="callout important"><span class="ctitle">Important</span>Each agent requires a unique API token. Agents are installed after Gateway SSL and domain configuration. Direct database access from agents is not permitted.</div>
<div class="callout link"><span class="ctitle">Full agent reference</span>For supported platforms, ports, auto-instrumentation and Kubernetes deployment, see <a class="inline" data-goto="poc-agent-overview">Edge Agent (Host Agent)</a> in the Technical Requirements document.</div>
`},
{book:'install', group:"Operations", id:"agent-troubleshoot", title:"Troubleshooting Agent Connection Issues", dek:"The diagnostic sequence when an agent fails to reach the App Server.", html:`
<div class="callout important"><span class="ctitle">Important</span>If the agent fails to communicate with the App Server, complete the following steps.</div>
<ol>
<li>Verify the <code>backend_url</code> in <code>edge-agent.yaml</code> is correct.</li>
<li>Test connectivity from the agent host to the App Server:
<pre><span class="lbl">Windows</span><button class="copybtn" data-copy>Copy</button>Test-NetConnection -ComputerName &lt;APP_SERVER_IP&gt; -Port 8081</pre>
<pre><span class="lbl">Linux</span><button class="copybtn" data-copy>Copy</button>telnet &lt;APP_SERVER_IP&gt; 8081</pre>
</li>
<li>If connectivity fails, check firewall rules on both hosts, network routing, and that the Edge Ingest service is running on the App Server (port 8081).</li>
<li>After correcting configuration, restart the Edge Ingest service, then restart the agent and re-check logs:
<pre><span class="lbl">Windows</span><button class="copybtn" data-copy>Copy</button>sc stop edge-ingest
sc start edge-ingest</pre>
<pre><span class="lbl">Linux</span><button class="copybtn" data-copy>Copy</button>sudo systemctl restart edge-ingest
sudo systemctl restart edge-agent</pre>
</li>
</ol>
<div class="callout success"><span class="ctitle">Success</span>Once the agent shows as 'Connected' in the tenant dashboard, telemetry data will begin flowing to the platform.</div>
`},
{book:'install', group:"Operations", id:"updates", title:"Update Management", dek:"Updates are pulled from the whitelisted repositories — no file transfers, client-approved by default.", html:`
<p>Because each server holds the code as a Git clone, updates are applied by pulling the new tagged release from the whitelisted repositories — no file transfers. Updates follow the NCG Africa Feature Rollout Schedule.</p>
<h2>Notification &amp; approval</h2>
<ul>
<li>NCG Africa notifies the client by email with a change description, version number, and proposed deployment window.</li>
<li>The client is given a minimum of <strong>14 business days</strong> to review before an update is applied.</li>
<li>Updates are client-approved by default: the client approves or raises concerns in writing, then both parties agree a window.</li>
</ul>
<h2>Applying an update</h2>
<pre><span class="lbl">cmd</span><button class="copybtn" data-copy>Copy</button>cd C:\\EDGE-PLATFORM
git fetch --all --tags
git checkout &lt;new-version-tag&gt;
:: reinstall dependencies if requirements changed, then restart affected services</pre>
<h2>Automatic updates (optional, off by default)</h2>
<p>If the client opts in writing, a Windows Scheduled Task can run a pull script at a defined interval that performs a <code>git pull</code> from the whitelisted repositories and restarts affected services. NCG Africa configures this during a maintenance window. Disabled by default.</p>
<h2>Rollback</h2>
<ul>
<li>The client notifies the NCG Africa engineer immediately; the engineer connects remotely or on-site.</li>
<li>If rollback is required, restore the previous tag: <code>git checkout &lt;previous-version-tag&gt;</code>.</li>
<li>Restart services and run a post-rollback health check; root-cause analysis is shared within 14 business days.</li>
</ul>
`},
{book:'install', group:"Operations", id:"post-install", title:"Post-Install Validation Checklist", dek:"Run through this list before declaring the deployment complete.", html:`
<ul>
<li>Database running and listening on port 5433.</li>
<li>Backend responding on port 8081 (<code>/docs</code> loads).</li>
<li>Gateway reachable on 8888 (and via 443 in production).</li>
<li>Dashboard UI loads and Super Admin can sign in.</li>
<li>Synthetic Runner heartbeats visible; location shows Connected.</li>
<li>Agent logs rotating; agent shows Connected/Active.</li>
<li>All <code>edge-*</code> services Running in <code>services.msc</code>.</li>
</ul>
`},
{book:'install', group:"Operations", id:"rollback", title:"Rollback & Recovery", dek:"Each module supports independent rollback.", html:`
<ul>
<li><strong>Dashboard and Synthetic Runner</strong> — WinSW uninstall scripts.</li>
<li><strong>Backend</strong> — Git checkout of the previous tag + virtual-environment rollback.</li>
<li><strong>Database</strong> — <code>rollback_edge_db.cmd</code> or snapshot restore.</li>
</ul>
`},
{book:'install', group:"Reference", id:"responsibilities", title:"Responsibilities Matrix", dek:"Who leads and who supports, across the deployment lifecycle.", html:`
<p>Responsibilities are split between NCG Africa and the client as follows. “Lead” denotes the party that performs the activity; “Support” denotes the party that assists or approves.</p>
<div class="tblwrap"><table>
<tr><th>Activity</th><th>NCG Africa</th><th>Client</th></tr>
<tr><td>Provide the deployment package</td><td>Lead</td><td>—</td></tr>
<tr><td>Provision UAT and production servers</td><td>—</td><td>Lead</td></tr>
<tr><td>Configure the firewall whitelist</td><td>Support (guidance)</td><td>Lead (implements)</td></tr>
<tr><td>Grant Local Administrator for installation</td><td>—</td><td>Lead</td></tr>
<tr><td>Execute installer and validation</td><td>Lead</td><td>Support (present)</td></tr>
<tr><td>UAT testing and sign-off</td><td>Support</td><td>Lead</td></tr>
<tr><td>Notify, schedule and approve updates</td><td>Lead (notify)</td><td>Lead (approve)</td></tr>
<tr><td>Apply updates / perform rollback</td><td>Lead</td><td>Support (approve window)</td></tr>
<tr><td>Ongoing support and escalation</td><td>Lead</td><td>Support (raise tickets)</td></tr>
</table></div>
`},
{book:'install', group:"Reference", id:"support", title:"Support, Escalation & Sign-Off", dek:"What to include in a support request, and where logs live.", html:`
<p>Support requests should include the affected server name, the error message or symptom, and the relevant log file from:</p>
<ul>
<li><code>C:\\Edge Deployment App\\runtime_logs\\</code></li>
<li><code>C:\\EDGE-PLATFORM\\runtime_logs\\</code></li>
<li><code>C:\\EDGE-PLATFORM\\services\\&lt;service&gt;\\runtime_logs\\</code></li>
</ul>
<div class="tblwrap"><table>
<tr><th>Item</th><th>Detail</th></tr>
<tr><td>Support hours</td><td>[Define — e.g. Monday–Friday, 08:00–18:00 WAT]</td></tr>
<tr><td>Primary contact</td><td>[Name / email]</td></tr>
<tr><td>Escalation</td><td>[Name / phone]</td></tr>
</table></div>
<p>By signing the source document, both parties confirm they have read and agreed to the deployment approach it describes.</p>
<div class="pillrow"><span class="pill">NCG Africa · Proprietary &amp; Confidential</span><span class="pill">Version 2.0</span><span class="pill">Source: PROD-SPEC-G-EdgeInstallationDeploymentGuide-2026Q2-v2_0_0-DTB.pdf</span></div>
`},

/* ================= SSL BOOK ================= */
{book:'ssl', group:"Overview", id:"ssl-overview", title:"Overview & Where This Fits", dek:"Complete SSL/TLS setup for the Gateway/UI and Edge Service Server — required before Edge Agents can be installed.", html:`
<p>This guide covers the complete SSL/TLS certificate setup required for the Edge platform Gateway/UI Server and Edge Service Server. It must be completed before Edge Agents can be installed.</p>
<p>As stated in the <a class="inline" data-goto="install:welcome">Edge Installation Guide</a>, the Edge Service Server and Gateway/UI must be configured with domain and SSL before installing Edge Agents. This guide follows the recommended installation order:</p>
<div class="stepgrid">
<div class="step"><div class="n">1</div><div class="body"><b>Complete all pre-installation checks</b></div></div>
<div class="step"><div class="n">2</div><div class="body"><b>Configure domain and SSL</b><span>← This guide covers this step</span></div></div>
<div class="step"><div class="n">3</div><div class="body"><b>Install Edge Database</b></div></div>
<div class="step"><div class="n">4</div><div class="body"><b>Install Edge Services</b></div></div>
<div class="step"><div class="n">5</div><div class="body"><b>Install Gateway/UI Server</b></div></div>
<div class="step"><div class="n">6</div><div class="body"><b>Install Edge RUM Service Server</b></div></div>
<div class="step"><div class="n">7</div><div class="body"><b>Install Edge Agents</b></div></div>
</div>
<div class="callout important"><span class="ctitle">Gate</span>Installation must not proceed without a valid SSL/TLS certificate. The certificate must match the assigned domain name and the full certificate chain trust must be available on the server before Gateway/UI configuration begins.</div>
`},
{book:'ssl', group:"Overview", id:"domain-naming", title:"Domain Naming Convention", dek:"A structured format combining environment, client identifier, and the client's base domain.", html:`
<pre><span class="lbl">pattern</span><button class="copybtn" data-copy>Copy</button>&lt;environment&gt;-&lt;client&gt;.edge.&lt;client-domain&gt;</pre>
<div class="tblwrap"><table>
<tr><th>Environment</th><th>Domain example</th><th>Notes</th></tr>
<tr><td>UAT</td><td><code>uat-&lt;client&gt;.edge.&lt;client-domain&gt;</code></td><td>User Acceptance Testing environment</td></tr>
<tr><td>Production</td><td><code>prod-&lt;client&gt;.edge.&lt;client-domain&gt;</code></td><td>Live production environment</td></tr>
<tr><td>Development</td><td><code>&lt;client&gt;.edge.&lt;client-domain&gt;</code></td><td>Development / internal testing</td></tr>
<tr><td>Wildcard (preferred)</td><td><code>*.edge.&lt;client-domain&gt;</code></td><td>Covers all environments with one cert</td></tr>
</table></div>
<div class="callout success"><span class="ctitle">Always ask for a wildcard first</span>Always request a wildcard certificate (<code>*.edge.&lt;client-domain&gt;</code>) from the client IT/Security team first. A single wildcard covers all environments and eliminates the need to manage separate certificates per environment.</div>
<div class="callout important"><span class="ctitle">Subdomain creation required</span>If the client's full registered domain is, for example, <code>kuda.ng</code>, the client must first create a dedicated subdomain before any SSL certificate can be issued. The SSL certificate is <strong>not</strong> issued on the root domain (<code>kuda.ng</code>) itself — it is issued on the subdomain created for Edge (e.g. <code>edge.kuda.ng</code>), and Edge then operates under that subdomain (e.g. <code>uat-kuda.edge.kuda.ng</code>, <code>prod-kuda.edge.kuda.ng</code>). The client's IT team is responsible for creating this subdomain in their DNS management console before any certificate is requested.</div>
`},
{book:'ssl', group:"Overview", id:"cert-requirements", title:"Certificate Requirements", dek:"Nginx requires PEM-format files — fullchain, private key, and an optional chain-only file.", html:`
<p>Edge uses Nginx on the Gateway/UI Server and Edge Service Server. Nginx requires certificates in PEM format. The following files must be provided by the client IT or Security team before installation proceeds.</p>
<div class="tblwrap"><table>
<tr><th>File</th><th>Format</th><th>Description</th><th>Example filename</th></tr>
<tr><td>SSL Certificate (Fullchain)</td><td>.pem</td><td>Server cert + intermediate CA cert combined</td><td><code>fullchain.pem</code></td></tr>
<tr><td>Private Key</td><td>.pem</td><td>Private key — NO passphrase attached (delivered as .pem, not .key)</td><td><code>_.edge.&lt;client-domain&gt;-key.pem</code></td></tr>
<tr><td>Chain-only (optional, recommended)</td><td>.pem</td><td>Intermediate/CA certificate only</td><td><code>_.edge.&lt;client-domain&gt;-chain-only.pem</code></td></tr>
</table></div>
<div class="callout important"><span class="ctitle">Valid PEM check</span>Every valid PEM certificate file opens with <code>-----BEGIN CERTIFICATE-----</code> and closes with <code>-----END CERTIFICATE-----</code>. If these headers are missing, the file is invalid or in the wrong format and Nginx will reject it.</div>
<h3>fullchain.pem — structure</h3>
<pre><span class="lbl">fullchain.pem</span><button class="copybtn" data-copy>Copy</button>-----BEGIN CERTIFICATE-----
(Your server certificate, e.g. uat-&lt;client&gt;.edge.&lt;client-domain&gt;)
-----END CERTIFICATE-----
-----BEGIN CERTIFICATE-----
(Intermediate / CA certificate issued by DigiCert, Sectigo, Let's Encrypt etc.)
-----END CERTIFICATE-----</pre>
<div class="callout important"><span class="ctitle">No passphrase</span>The private key must have NO passphrase. Nginx cannot start if the key requires a passphrase at boot time. The client must export the key without a passphrase.</div>
`},
{book:'ssl', group:"Setup Steps", id:"step1-2", title:"Step 1–2 · Obtain the Certificate & Verify DNS", dek:"Request the certificate from the client, then confirm DNS resolves to the correct server before touching SSL.", html:`
<h2>Step 1 — Obtain the SSL certificate from the client</h2>
<p>Request the following from the Client IT / Security team before beginning installation. The domain must already exist and the client must own and manage it.</p>
<div class="tblwrap"><table>
<tr><th>Item to request</th><th>Details</th></tr>
<tr><td>Wildcard certificate (preferred)</td><td><code>*.edge.&lt;client-domain&gt;</code> — covers all environments</td></tr>
<tr><td>OR individual certificates</td><td>One per environment: <code>uat-*.edge</code>, <code>prod-*.edge</code>, <code>*.edge</code></td></tr>
<tr><td>Certificate format</td><td>.pem format (Base64, begins with <code>-----BEGIN CERTIFICATE-----</code>)</td></tr>
<tr><td>Private key</td><td>.pem format — passphrase-free (also delivered as .pem, not .key)</td></tr>
<tr><td>CA / intermediate certificate</td><td>Needed to build the fullchain</td></tr>
</table></div>
<div class="callout success"><span class="ctitle">cPanel shortcut</span>If the client uses cPanel to manage their domain, they can export the certificate directly from cPanel: Security → SSL/TLS → Certificates (CRT). The certificate text shown there is already in PEM format.</div>
<div class="callout important"><span class="ctitle">Subdomain creation — client action required</span>The SSL certificate is not issued on the client's root domain. If the client's registered domain is <code>kuda.ng</code>, they must first create a subdomain dedicated to Edge — e.g. <code>edge.kuda.ng</code> — in their DNS management console. Only after this subdomain exists can a certificate be issued for it. Edge does not create or register domains on the client's behalf.</div>
<h2>Step 2 — Verify the DNS A Record points to the Edge server</h2>
<p>Before proceeding, confirm that the client's DNS A Record is correctly pointing to the Edge Gateway/UI Server IP address and also the Edge Service Server. SSL will not work if DNS is misconfigured.</p>
<div class="callout note"><span class="ctitle">Run from inside the client network</span>This verification must be run from inside the client's network environment. DNS resolution may differ between internal and external networks (split-horizon DNS).</div>
<pre><span class="lbl">Windows Command Prompt — inside client environment</span><button class="copybtn" data-copy>Copy</button>ping uat-&lt;client&gt;.edge.&lt;client-domain&gt;</pre>
<p>Expected output — the IP shown must match the Edge Gateway server IP:</p>
<pre><span class="lbl">Expected response</span><button class="copybtn" data-copy>Copy</button>Pinging uat-&lt;client&gt;.edge.&lt;client-domain&gt; [&lt;Gateway-Server-IP&gt;] with 32 bytes of data:
Reply from &lt;Gateway-Server-IP&gt;: bytes=32 time=1ms TTL=64</pre>
<p>Also confirm with nslookup:</p>
<pre><span class="lbl">nslookup verification</span><button class="copybtn" data-copy>Copy</button>nslookup uat-&lt;client&gt;.edge.&lt;client-domain&gt;</pre>
<div class="tblwrap"><table>
<tr><th>DNS record type</th><th>What it does</th><th>Example</th></tr>
<tr><td>A Record (Required)</td><td>Points domain to the Gateway/UI Server public IP</td><td><code>uat-&lt;client&gt;.edge.&lt;client-domain&gt;</code> → <code>&lt;Gateway-Server-IP&gt;</code></td></tr>
<tr><td>CNAME (Optional)</td><td>Alias to another domain</td><td><code>edge.&lt;client-domain&gt;</code> → <code>monitoring.&lt;client-domain&gt;</code></td></tr>
</table></div>
<div class="callout important"><span class="ctitle">Gate</span>Do not proceed to SSL installation if the domain does not resolve to the correct server IP. SSL configuration on the wrong server will fail and the certificate will not match.</div>
`},
{book:'ssl', group:"Setup Steps", id:"step3-4", title:"Step 3–4 · Place Files & Build the Fullchain", dek:"Store the certificate files securely, then concatenate server + CA certs in the correct order.", html:`
<h2>Step 3 — Place SSL certificate files on the Gateway Server and Edge Service Server</h2>
<p>Once the certificate files are received from the client, copy them to the Edge Gateway/UI Server and also the Edge Service Server in a secure, dedicated SSL directory.</p>
<p>Recommended SSL file storage location on Windows (Gateway/UI Server):</p>
<pre><span class="lbl">Windows path — recommended</span><button class="copybtn" data-copy>Copy</button>C:\\SSL\\&lt;client-identifier&gt;\\</pre>
<pre><span class="lbl">Example — &lt;client&gt;</span><button class="copybtn" data-copy>Copy</button>C:\\SSL\\&lt;client&gt;\\fullchain.pem
C:\\SSL\\&lt;client&gt;\\_.edge.&lt;client-domain&gt;-key.pem
C:\\SSL\\&lt;client&gt;\\_.edge.&lt;client-domain&gt;-chain-only.pem</pre>
<div class="callout important"><span class="ctitle">Restrict folder access</span>Only the SYSTEM account and Local Administrators should have read access. The private key must never be shared or exposed.</div>
<h2>Step 4 — Build the fullchain certificate (if not already provided)</h2>
<p>The <code>fullchain.pem</code> is required by Nginx. It must contain both the server certificate and the intermediate CA certificate, in the correct order.</p>
<div class="callout note"><span class="ctitle">Formula</span>Server Certificate + CA / Intermediate Certificate = <code>fullchain.pem</code></div>
<p>Run this command on the Gateway server (Windows Command Prompt or PowerShell):</p>
<pre><span class="lbl">Windows — combine cert + CA into fullchain</span><button class="copybtn" data-copy>Copy</button>type server-cert.pem ca-bundle.pem > C:\\SSL\\&lt;client&gt;\\fullchain.pem</pre>
<p>Or if you have a separate intermediate file:</p>
<pre><span class="lbl">Alternative — combine with intermediate</span><button class="copybtn" data-copy>Copy</button>type &lt;env&gt;-&lt;client&gt;-cert.pem intermediate.pem > C:\\SSL\\&lt;client&gt;\\fullchain.pem</pre>
<div class="callout important"><span class="ctitle">Order is mandatory</span>Server certificate MUST come first, followed by the intermediate certificate. Reversing the order causes Nginx to fail on startup.</div>
<p>The completed <code>fullchain.pem</code> should look like this when opened:</p>
<pre><span class="lbl">fullchain.pem — two concatenated certificates</span><button class="copybtn" data-copy>Copy</button>-----BEGIN CERTIFICATE-----
MIIDXTCCAkWgAwIBAgIJAJC1HiIAZAiI... (server certificate)
-----END CERTIFICATE-----
-----BEGIN CERTIFICATE-----
MIIEkjCCA3qgAwIBAgIQCgFBQgAAAA... (intermediate / CA certificate)
-----END CERTIFICATE-----</pre>
`},
{book:'ssl', group:"Setup Steps", id:"step5", title:"Step 5 · Remove the Passphrase from the Private Key", dek:"Nginx requires a passphrase-free key — here's how to check, and how to convert one safely if needed.", html:`
<p>The Edge Nginx configuration requires a passphrase-free private key. The private key is delivered as a .pem file (not .key). Ideally, the client should provide a private key with no passphrase attached. If the key delivered by the client has a passphrase, request a passphrase-free version from the client IT/Security team first before attempting any conversion.</p>
<p>To check if the key has a passphrase, open it in a text editor. If it contains the line <code>ENCRYPTED</code>, it has a passphrase.</p>
<div class="callout important"><span class="ctitle">Security policy note</span>If the client insists they cannot provide a passphrase-free key, the passphrase removal must be performed outside the client's server environment — on a secure, isolated machine controlled by the Edge team. The converted key (passphrase-free) is then transferred to the Gateway server. Running OpenSSL on the client's production server to strip a passphrase may not be permitted under their security policy.</p>
<p>If conversion is necessary, run the following on a secure machine outside the client's server environment (install OpenSSL for Windows on the Edge team's machine if not already available):</p>
<pre><span class="lbl">Remove passphrase from private key</span><button class="copybtn" data-copy>Copy</button>openssl rsa -in key-with-passphrase.pem -out C:\\SSL\\&lt;client&gt;\\_.edge.&lt;client-domain&gt;-key.pem</pre>
<div class="callout success"><span class="ctitle">What happens</span>You will be prompted to enter the existing passphrase once. The output file will be passphrase-free. Securely transfer this converted key file to <code>C:\\SSL\\&lt;client&gt;\\</code> on the Gateway server and proceed with Nginx configuration.</div>
`},
{book:'ssl', group:"Setup Steps", id:"step6", title:"Step 6 · Update the Gateway Nginx Config", dek:"Point ssl_certificate, ssl_certificate_key and ssl_trusted_certificate at the files placed in Step 3.", html:`
<p>The SSL certificate paths are configured inside the Edge Platform gateway folder's configuration file. The file must be updated to point to the correct certificate locations placed on the server in Step 3.</p>
<pre><span class="lbl">Windows path — Gateway conf directory</span><button class="copybtn" data-copy>Copy</button>C:\\EDGE-PLATFORM\\gateway\\conf\\</pre>
<pre><span class="lbl">HTTPS gateway config file — filename</span><button class="copybtn" data-copy>Copy</button>edge-gateway.prod.https.conf</pre>
<p>Locate the SSL certificate section near the top of the <code>server {}</code> block and update the paths to match where the certificate files were placed in Step 3:</p>
<pre><span class="lbl">edge-gateway.prod.https.conf — SSL certificate section</span><button class="copybtn" data-copy>Copy</button>server {
  listen 443 ssl;
  server_name edge.&lt;client-domain&gt; *.edge.&lt;client-domain&gt;;

  # --- TLS certs (as provided) — update paths to match Step 3 ---
  ssl_certificate     C:/SSL/&lt;client&gt;/fullchain.pem;
  ssl_certificate_key C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-key.pem;

  # (Recommended) Use fullchain if available — uncomment to enable:
  # ssl_certificate C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-fullchain.pem;

  ssl_trusted_certificate C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-chain-only.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  location / {
    proxy_pass http://localhost:8081;
  }
}</pre>
<div class="callout note"><span class="ctitle">Forward slashes on Windows</span>On Windows, Nginx accepts forward slashes in paths (<code>C:/SSL/&lt;client&gt;/...</code>). Both forward and back slashes are supported, but forward slashes are recommended to avoid escape issues.</div>
<p>Also add the HTTP-to-HTTPS redirect block, so all plain HTTP traffic is redirected:</p>
<pre><span class="lbl">HTTP redirect block</span><button class="copybtn" data-copy>Copy</button>server {
  listen 80;
  server_name edge.&lt;client-domain&gt; *.edge.&lt;client-domain&gt;;
  return 301 https://$host$request_uri;
}</pre>
<div class="tblwrap"><table>
<tr><th>Config directive</th><th>Purpose</th><th>Value example</th></tr>
<tr><td><code>ssl_certificate</code></td><td>Path to fullchain.pem (server + intermediate certs combined)</td><td><code>C:/SSL/&lt;client&gt;/fullchain.pem</code></td></tr>
<tr><td><code>ssl_certificate_key</code></td><td>Path to private key file — no passphrase</td><td><code>C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-key.pem</code></td></tr>
<tr><td><code>ssl_trusted_certificate</code></td><td>Path to chain-only cert (intermediate/CA only) for OCSP stapling</td><td><code>C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-chain-only.pem</code></td></tr>
<tr><td><code>ssl_protocols</code></td><td>Enforce TLS 1.2 and 1.3 only — older versions disabled</td><td><code>TLSv1.2 TLSv1.3</code></td></tr>
<tr><td><code>server_name</code></td><td>Domain names this block applies to</td><td><code>edge.&lt;client-domain&gt; *.edge.&lt;client-domain&gt;</code></td></tr>
</table></div>
`},
{book:'ssl', group:"Setup Steps", id:"step7-8", title:"Step 7–8 · Restart Nginx & Verify HTTPS", dek:"Reload through Service Manager, then confirm HTTPS works from inside the client network.", html:`
<h2>Step 7 — Restart the Edge Nginx service and verify</h2>
<p>After saving changes to <code>edge-gateway.prod.https.conf</code>, restart the Edge Nginx service through Windows Service Manager on the Gateway/UI Server. Do not restart manually from the command line.</p>
<div class="stepgrid">
<div class="step"><div class="n">1</div><div class="body"><span>Press <strong>Windows + R</strong>, type <code>services.msc</code>, and press Enter.</span></div></div>
<div class="step"><div class="n">2</div><div class="body"><span>Locate the Edge Nginx service in the list (named <code>edge-nginx</code> or similar).</span></div></div>
<div class="step"><div class="n">3</div><div class="body"><span>Right-click the service and select Restart.</span></div></div>
<div class="step"><div class="n">4</div><div class="body"><span>Confirm the service status returns to Running.</span></div></div>
</div>
<p>If the service fails to start or shows an error, navigate to the Edge gateway runtime logs directory and open the latest log file to identify the error:</p>
<pre><span class="lbl">Runtime logs path — Gateway server</span><button class="copybtn" data-copy>Copy</button>C:\\EDGE-PLATFORM\\gateway\\runtime_logs\\</pre>
<p>Open the latest log file (sorted by date modified) and look for the error entry. Common causes of service startup failure include an incorrect SSL file path in <code>edge-gateway.prod.https.conf</code>, a missing certificate file, or a private key that still has a passphrase. Resolve the issue in the config file and restart the service again via Service Manager.</p>
<h2>Step 8 — Test HTTPS connectivity from the client environment</h2>
<p>After Nginx reloads successfully, verify that HTTPS is working from inside the client's network environment.</p>
<h3>Test 1 — Check HTTPS response with curl</h3>
<pre><span class="lbl">curl test</span><button class="copybtn" data-copy>Copy</button>curl -I https://uat-&lt;client&gt;.edge.&lt;client-domain&gt;</pre>
<p>A successful response returns HTTP headers starting with <code>HTTP/2 200</code> or <code>HTTP/1.1 301</code>. Any SSL handshake error means the certificate or chain is misconfigured.</p>
<h3>Test 2 — Open in browser</h3>
<pre><span class="lbl">Browser test</span><button class="copybtn" data-copy>Copy</button>https://uat-&lt;client&gt;.edge.&lt;client-domain&gt;</pre>
<div class="callout success"><span class="ctitle">Valid setup</span>A valid HTTPS setup shows a padlock icon in the browser address bar with no warnings. Click the padlock to verify the certificate details, including the issuer and expiry date.</div>
`},
{book:'ssl', group:"Reference", id:"ssl-troubleshooting", title:"Troubleshooting", dek:"Common SSL/Nginx failure symptoms, their likely cause, and the fix.", html:`
<div class="tblwrap"><table>
<tr><th>Issue</th><th>Likely cause</th><th>Fix</th></tr>
<tr><td>Browser shows 'Not Secure' or cert warning</td><td>Domain isn't pointing to the server IP address</td><td>Make sure the domain created is pointing to the IP address</td></tr>
<tr><td><code>nginx -t</code> fails with 'no such file'</td><td>SSL file path in <code>edge-gateway.prod.https.conf</code> is incorrect</td><td>Verify paths match exactly where files were placed in Step 3</td></tr>
<tr><td><code>nginx -t</code> fails with 'PEM_read'</td><td>Key has a passphrase</td><td>Re-export key without passphrase (Step 5)</td></tr>
<tr><td>ping resolves wrong or no IP</td><td>DNS A Record not yet updated</td><td>Wait for DNS propagation (up to 24 hrs) or flush DNS: <code>ipconfig /flushdns</code></td></tr>
<tr><td>curl shows SSL handshake error</td><td>TLS version mismatch or chain incomplete</td><td>Check <code>ssl_protocols</code> in Nginx, verify fullchain has both certificates</td></tr>
<tr><td>Nginx fails to start after reload</td><td>Certificate or key file permission issue</td><td>Ensure SYSTEM/Admin has read access to <code>C:\\SSL\\</code> folder</td></tr>
</table></div>
`},
{book:'ssl', group:"Reference", id:"wildcard-vs-individual", title:"Wildcard vs. Individual Certificates", dek:"How to merge separately-issued environment certificates into one wildcard fullchain.", html:`
<h2>Option A — Preferred: wildcard certificate</h2>
<p>A wildcard certificate covers all subdomains under the edge domain with a single certificate:</p>
<pre><span class="lbl">Wildcard</span><button class="copybtn" data-copy>Copy</button>*.edge.&lt;client-domain&gt;</pre>
<p>This single certificate covers: <code>uat-&lt;client&gt;.edge.&lt;client-domain&gt;</code>, <code>prod-&lt;client&gt;.edge.&lt;client-domain&gt;</code>, <code>dev-&lt;client&gt;.edge.&lt;client-domain&gt;</code>, and any future environments.</p>
<pre><span class="lbl">Wildcard server_name</span><button class="copybtn" data-copy>Copy</button>server_name edge.&lt;client-domain&gt; *.edge.&lt;client-domain&gt;;</pre>
<h2>Option B — Individual certificates per environment</h2>
<p>If the client cannot issue a wildcard, they must provide individual certificates for each environment and hostname, each with its own matching private key. Based on the Example Bank pattern, expected files (in .pem format):</p>
<ul>
<li><strong>CACert</strong> — the CA / intermediate certificate (shared across all environments)</li>
<li><code>prod-example_edge_examplebank_net.pem</code> — Prod server certificate + private key</li>
<li><code>uat-example_edge_examplebank_net.pem</code> — UAT server certificate + private key</li>
<li><code>edge_examplebank_net.pem</code> — Base edge domain certificate + private key</li>
</ul>
<h2>Merge all certificates into a wildcard fullchain</h2>
<p>When the client provides individual certificates per environment, they can all be merged into a single wildcard fullchain covering every environment under <code>*.edge.&lt;client-domain&gt;</code>. This happens in two phases.</p>
<h3>Phase 1 — merge all environment server certificates together</h3>
<pre><span class="lbl">Merge prod + uat + base edge certs</span><button class="copybtn" data-copy>Copy</button>type prod-example_edge_examplebank_net uat-example_edge_examplebank_net edge_examplebank_net > C:\\SSL\\examplebank\\combined-certs.pem</pre>
<h3>Phase 2 — merge the combined file with the CACert</h3>
<pre><span class="lbl">combined-certs.pem + CACert = wildcard fullchain</span><button class="copybtn" data-copy>Copy</button>type combined-certs.pem CACert > C:\\SSL\\examplebank\\wildcard-fullchain.pem</pre>
<p>The resulting <code>wildcard-fullchain.pem</code> can now be used in the Nginx server block to cover all environments with a single certificate entry:</p>
<pre><span class="lbl">Using the merged wildcard fullchain</span><button class="copybtn" data-copy>Copy</button>server {
  listen 443 ssl;
  server_name edge.&lt;client-domain&gt; *.edge.&lt;client-domain&gt;;
  ssl_certificate     C:/SSL/&lt;client&gt;/wildcard-fullchain.pem;
  ssl_certificate_key C:/SSL/&lt;client&gt;/_.edge.&lt;client-domain&gt;-key.pem;
  ...
}</pre>
<div class="callout success"><span class="ctitle">Formula summary</span>[prod cert] + [uat cert] + [base edge cert] = <code>combined-certs.pem</code>, then [combined-certs.pem] + [CACert] = <code>wildcard-fullchain.pem</code>. This final file covers <code>*.edge.&lt;client-domain&gt;</code> and can serve all environments from a single Nginx server block.</div>
`},
{book:'ssl', group:"Reference", id:"ssl-checklist", title:"Final Pre-Start Checklist", dek:"Confirm all of these before handing over to Edge Agent installation.", html:`
<ul>
<li>DNS A Record verified — domain resolves to correct Gateway server IP from inside client network</li>
<li>SSL certificate received in .pem format — opens with <code>-----BEGIN CERTIFICATE-----</code></li>
<li>Private key received in .pem format — passphrase-free confirmed (delivered as .pem, not .key)</li>
<li>Wildcard certificate obtained (<code>*.edge.&lt;client-domain&gt;</code>) — OR individual certs per environment</li>
<li><code>fullchain.pem</code> built: server certificate + CA/intermediate certificate concatenated in correct order</li>
<li>SSL files stored in <code>C:\\SSL\\&lt;client&gt;\\</code> on the Gateway server with restricted permissions</li>
<li><code>edge-gateway.prod.https.conf</code> updated — <code>ssl_certificate</code>, <code>ssl_certificate_key</code>, and <code>ssl_trusted_certificate</code> paths all point to the correct files</li>
<li><code>nginx -t</code> passes with no errors</li>
<li>Edge Nginx service restarted via Windows Service Manager — service status shows Running</li>
<li>HTTPS tested from client environment with curl and browser</li>
<li>Browser padlock shows valid certificate with correct domain and issuer</li>
<li>HTTP (port 80) redirects to HTTPS (port 443)</li>
</ul>
<div class="callout gate"><span class="ctitle">Gate</span>Only after all items above are confirmed should Edge Agent installation proceed. As per the Installation Guide: Gateway/UI must be configured with domain and SSL before installing Edge Agents.</div>
<div class="pillrow"><span class="pill">NCG Africa · Proprietary &amp; Confidential</span><span class="pill">Version 1.0</span><span class="pill">Source: PROD-SOP-I-EDGESSLINSLLATIONGUIDE-2026Q1-V1_0_0.pdf</span></div>
`},

/* ================= TECHNICAL REQUIREMENTS (Production + POC, combined) ================= */
{book:'trd', group:"Overview", id:"trd-purpose", title:"Purpose & Architecture Overview", dek:"Infrastructure, connectivity, and system requirements for Edge — covering both the full production topology and the consolidated proof-of-concept layout.", html:`
<p>This document defines the infrastructure, connectivity, and system requirements for deploying the Edge Enterprise Performance Monitoring platform. It is intended for enterprise IT, security, infrastructure, and operations teams to support planning, deployment, and approval activities.</p>
<p>Edge supports two deployment topologies, covered together throughout this document:</p>
<ul>
<li><strong>Production</strong> — the Gateway/UI, Edge Services, and Database roles run on three separate servers, each sized and secured independently.</li>
<li><strong>Proof of concept (POC)</strong> — the Gateway/UI, Edge Services, and Database roles are consolidated onto a single combined server. A separate Edge RUM Service Server is used in both topologies.</li>
</ul>
<p>Each section below covers both topologies together and calls out where POC differs from production.</p>
<h2>Architectural overview</h2>
<p>Edge is deployed as a modular, service-oriented platform designed to operate within enterprise environments while maintaining strict separation of concerns between user access, application services, and data storage. At a high level, the architecture consists of:</p>
<ul>
<li>A <strong>Gateway and UI layer</strong> that provides secure user access</li>
<li>An <strong>Application Services layer</strong> that handles ingestion, processing, analytics, alerting, and AI insights</li>
<li>A <strong>Database layer</strong> that stores telemetry, configuration, and historical data</li>
</ul>
<p>The platform supports internal-only deployments as well as controlled internet-facing access through secure gateways.</p>
`},
{book:'trd', group:"Overview", id:"trd-diagram", title:"Logical Architecture Description", dek:"How the Gateway/UI, Services, Database, and RUM layers communicate — on separate hosts in production, or one combined host for a POC.", html:`
<p>End users access the platform through a secure HTTPS connection to the <strong>Gateway/UI</strong> role. It hosts the Edge web interface and acts as the primary interaction point for users, external integrations, and approved outbound services.</p>
<p>The Gateway/UI role communicates with the <strong>Edge Services</strong> role over internal TCP ports. This communication is bilateral, enabling both request-driven interactions and service-initiated updates such as alerts, state changes, and data synchronization. Edge Services handles all internal processing — ingestion, analytics, alerting, automation, task monitoring, and AI insights — and communicates with the <strong>Database</strong> role to store and retrieve telemetry data, configuration information, execution records, and historical analytics.</p>
