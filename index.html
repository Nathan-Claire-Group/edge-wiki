<p class="figcap">Internal ports within the combined server (8081–8087/TCP, 5433/TCP) still apply — the roles just share one host instead of communicating across the network.</p>

<div class="tblwrap"><table>
<tr><th>Topology</th><th>How Gateway/UI, Services, and Database communicate</th></tr>
<tr><td>Production</td><td>Three separate servers — Gateway/UI ⇄ Edge Services ⇄ Database traffic crosses the network, on the ports covered in <a class="inline" data-goto="trd-gateway">Requirements</a>.</td></tr>
<tr><td>POC</td><td>All three roles run on a single combined server, so this traffic stays internal to that host. The same ports and bilateral behaviour apply — it just never crosses the network.</td></tr>
</table></div>
<p>Host agents and the synthetic runner connect to the Gateway/UI (production) or the combined server (POC), while the Edge SDK and client applications send telemetry to the separate <strong>Edge RUM Service Server</strong>, present in both topologies.</p>
<h2>Outbound connectivity</h2>
<p>Outbound connectivity from these servers is tightly controlled. These include:</p>
<ul>
<li>Email services for alert notifications</li>
<li>Package or container repositories for updates</li>
<li>The Chat API endpoint for Ask Edge and AI Insights, when enabled</li>
</ul>
<p>Administrative access to all servers is restricted to internal networks and secured using approved remote management protocols. This architecture ensures clear network segmentation, minimal external exposure, strong security boundaries, and support for bilateral service communication — with production adding flexible scalability across separated servers, and POC adding a simplified single-server footprint suited to evaluation.</p>
<div class="callout important"><span class="ctitle">Note</span>SSL/TLS configuration on the Gateway/UI Server must be completed before downloading or installing the Edge Agent — see the <a class="inline" data-goto="ssl-overview">SSL/TLS Certificate Setup Guide</a>.</div>
`},
{book:'trd', group:"Requirements", id:"trd-gateway", title:"Gateway/UI, Edge Services & Database", dek:"Ports and sizing for these three roles — as three separate servers in production, or one combined server for a POC.", html:`
<p>Gateway/UI, Edge Services, and Database share the same internal ports and connectivity requirements in both topologies. What differs is how many physical servers they run on.</p>

<h2>Production — three separate servers</h2>
<h3>Gateway/UI Server</h3>
<div class="tblwrap"><table>
<tr><th>#</th><th>Port</th><th>Detail</th><th>Description</th><th>Purpose</th><th>Direction</th></tr>
<tr><td>1</td><td>443/TCP</td><td>User → Gateway/UI Server</td><td>Secure HTTPS access to Edge UI via LAN or Internet</td><td>User access to application interface</td><td>Unilateral</td></tr>
<tr><td>2</td><td>8081–8087/TCP</td><td>Gateway/UI ⇄ Edge Services</td><td>Internal API communication between Gateway/UI and Edge Services</td><td>Access to Edge services</td><td>Bilateral</td></tr>
<tr><td>3</td><td>587/TCP (465 if SMTPS)</td><td>Gateway/UI → SMTP Server</td><td>Outbound connectivity for notifications and alerts via email</td><td>Email alerting integration</td><td>Unilateral</td></tr>
<tr><td>4</td><td>443/TCP</td><td>Gateway/UI → api.openai.com</td><td>HTTPS access for Ask Edge AI features</td><td>Enable Ask Edge and AI insights</td><td>Unilateral</td></tr>
<tr><td>5</td><td>443/TCP</td><td>SSL/TLS Certificate Installation</td><td>A valid SSL/TLS certificate must be installed on the Gateway/UI Server</td><td>Prevents unencrypted access; protects credentials and session data</td><td>Unilateral</td></tr>
<tr><td>6</td><td>443/TCP</td><td>Domain Name Configuration</td><td>A fully qualified domain name must be assigned to the Gateway/UI Server</td><td>Consistent, secure, user-friendly access to the Edge UI</td><td>Unilateral</td></tr>
</table></div>
<h3>Edge Services Server</h3>
<div class="tblwrap"><table>
<tr><th>#</th><th>Port</th><th>Detail</th><th>Description</th><th>Purpose</th><th>Direction</th></tr>
<tr><td>1</td><td>8081–8087/TCP</td><td>Gateway/UI ⇄ Edge Services</td><td>Bidirectional internal service communication</td><td>Core Edge services access</td><td>Bilateral</td></tr>
<tr><td>2</td><td>5433/TCP</td><td>Edge Services ⇄ Database</td><td>Read and write telemetry, configuration, analytics outputs</td><td>Telemetry and metadata storage</td><td>Bilateral</td></tr>
<tr><td>3</td><td>587/TCP (465 if SMTPS)</td><td>Edge Services → SMTP Server</td><td>Outbound email for alerting and notifications</td><td>Email alerting integration</td><td>Unilateral</td></tr>
<tr><td>4</td><td>TBD</td><td>Edge Services → Client Container &amp; Package Repository</td><td>Outbound connectivity for updates</td><td>Package and container updates</td><td>Unilateral</td></tr>
<tr><td>5</td><td>3389/RDP</td><td>Admin → Edge Services Server</td><td>Internal remote administration</td><td>System administration</td><td>Unilateral</td></tr>
</table></div>
<h3>Database Server</h3>
<div class="tblwrap"><table>
<tr><th>#</th><th>Port</th><th>Detail</th><th>Description</th><th>Purpose</th><th>Direction</th></tr>
<tr><td>1</td><td>5433/TCP</td><td>Edge Services ⇄ Database Server</td><td>Primary connectivity for telemetry storage and retrieval</td><td>Telemetry and metadata storage</td><td>Bilateral</td></tr>
<tr><td>2</td><td>5433/TCP</td><td>RUM Server ⇄ Database Server</td><td>Database connectivity where RUM requires direct access</td><td>Database access</td><td>Bilateral</td></tr>
<tr><td>3</td><td>TBD</td><td>Database Server → Client Container &amp; Package Repository</td><td>Outbound connectivity for updates depending on client environment</td><td>Package and container updates</td><td>Unilateral</td></tr>
<tr><td>4</td><td>3389/RDP</td><td>Admin → Database Server</td><td>Internal remote administration</td><td>System administration</td><td>Unilateral</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>Internet access is required for installation, and on <code>api.openai.com</code> 443 for Ask Edge / AI Insights. Temporary internet access is required on the Edge Services and Database servers during installation.</div>
<h3>Sizing guidance (production)</h3>
<div class="tblwrap"><table>
<tr><th>Deployment context</th><th>Server</th><th>CPU</th><th>Memory</th><th>Disk</th></tr>
<tr><td>Small</td><td>Gateway/UI (shared with Services)</td><td>8 vCPU</td><td>16 to 32 GB RAM</td><td>400 to 500 GB SSD</td></tr>
<tr><td>Small</td><td>Edge Services (shared with Gateway)</td><td>8 vCPU</td><td>16 to 32 GB RAM</td><td>400 to 500 GB SSD</td></tr>
<tr><td>Small</td><td>Database Server</td><td>8 to 16 vCPU</td><td>32 to 64 GB RAM</td><td>500 GB+ NVMe or SSD</td></tr>
<tr><td>Medium</td><td>Gateway/UI (shared with Services)</td><td>16 to 32 vCPU total</td><td>64 GB RAM</td><td>400 to 500 GB SSD</td></tr>
<tr><td>Medium</td><td>Edge Services (shared with Gateway)</td><td>16 to 32 vCPU total</td><td>64 GB RAM</td><td>400 to 500 GB SSD</td></tr>
<tr><td>Medium</td><td>Database Server</td><td>16 to 32 vCPU total</td><td>128 GB RAM</td><td>1 to 5 TB NVMe</td></tr>
<tr><td>Large</td><td>Gateway/UI Servers, 2 to 4 nodes behind load balancer</td><td>Benchmark driven</td><td>Benchmark driven</td><td>Benchmark driven</td></tr>
<tr><td>Large</td><td>Edge Services (per-service scaling)</td><td>Benchmark driven</td><td>Benchmark driven</td><td>Benchmark driven</td></tr>
<tr><td>Large</td><td>Database Server, managed cluster recommended</td><td>Benchmark driven</td><td>Benchmark driven</td><td>Benchmark driven</td></tr>
</table></div>

<h2>POC — one combined server</h2>
<p>In a POC, the Gateway/UI, Edge Services, and Database roles above run together on a single server. The port list is the union of the three production tables, plus the domain/SSL requirement for the Gateway/UI role:</p>
<div class="tblwrap"><table>
<tr><th>#</th><th>Port</th><th>Detail</th><th>Description</th><th>Purpose</th><th>Direction</th></tr>
<tr><td>1</td><td>443/TCP</td><td>User → Gateway/UI Server</td><td>Secure HTTPS access to Edge UI via LAN or Internet</td><td>User access to application interface</td><td>Unilateral</td></tr>
<tr><td>2</td><td>8081–8087/TCP</td><td>Gateway/UI ⇄ Edge Services</td><td>Internal API communication between Gateway/UI and Edge Services</td><td>Access to Edge services</td><td>Bilateral</td></tr>
<tr><td>3</td><td>587/TCP (465 if SMTPS)</td><td>Combined → SMTP Server</td><td>Outbound connectivity for notifications and alerts via email</td><td>Email alerting integration</td><td>Unilateral</td></tr>
<tr><td>4</td><td>443/TCP</td><td>Combined → api.openai.com</td><td>HTTPS access for Ask Edge AI features</td><td>Enable Ask Edge and AI insights</td><td>Unilateral</td></tr>
<tr><td>5</td><td>443/TCP</td><td>SSL/TLS Certificate Installation</td><td>A valid SSL/TLS certificate must be installed on the Gateway/UI Server</td><td>Prevents unencrypted access; protects credentials and session data</td><td>Unilateral</td></tr>
<tr><td>6</td><td>443/TCP</td><td>Domain Name Configuration</td><td>A fully qualified domain name must be assigned to the Gateway/UI Server</td><td>Consistent, secure, user-friendly access to the Edge UI</td><td>Unilateral</td></tr>
<tr><td>7</td><td>5433/TCP</td><td>Gateway/UI ⇄ Edge Services</td><td>Internal API communication between Gateway/UI and Edge Services</td><td>Telemetry and metadata storage</td><td>Bilateral</td></tr>
<tr><td>8</td><td>5433/TCP</td><td>RUM Server ⇄ Database Server</td><td>Database connectivity where RUM requires direct access</td><td>Database access</td><td>Bilateral</td></tr>
</table></div>
<h3>Sizing guidance (POC)</h3>
<div class="tblwrap"><table>
<tr><th>Deployment context</th><th>Server</th><th>CPU</th><th>Memory</th><th>Disk</th></tr>
<tr><td>POC Small Deployment</td><td>Gateway/UI / Services / DB (combined)</td><td>16 to 32 vCPU total</td><td>32 to 64 GB RAM</td><td>500 GB to 1 TB SSD</td></tr>
</table></div>
`},
{book:'trd', group:"Requirements", id:"trd-rum", title:"Edge RUM Service Server", dek:"Ports for Real User Monitoring ingestion, analytics, and database/cache access — identical in both topologies bar one port.", html:`
<div class="tblwrap"><table>
<tr><th>#</th><th>Port</th><th>Detail</th><th>Description</th><th>Purpose</th><th>Direction</th></tr>
<tr><td>1</td><td>443/TCP</td><td>Edge RUM Service Server (Domain + SSL)</td><td>HTTPS endpoint configured with a fully qualified domain name</td><td>Secure RUM endpoint and trusted service communication</td><td>Unilateral</td></tr>
<tr><td>2</td><td>8003/TCP</td><td>Gateway/UI → Edge RUM Service Server</td><td>RUM / telemetry ingestion endpoint (POST /telemetry); listens on 8000, published on 8003</td><td>Dedicated RUM ingestion and processing</td><td>Unilateral (inbound)</td></tr>
<tr><td>3</td><td>5432/TCP (production) · 5433/TCP (POC)</td><td>Edge RUM Service Server ⇄ Database</td><td>API-key validation (rum_api_keys) on PostgreSQL / TimescaleDB; TLS required by default</td><td>API key lookup and RUM metadata</td><td>Bilateral</td></tr>
<tr><td>4</td><td>9092/TCP</td><td>Edge RUM Service Server → Kafka Brokers</td><td>Accepted telemetry published to topic <code>telemetry-upsert</code></td><td>RUM telemetry streaming</td><td>Unilateral (outbound)</td></tr>
<tr><td>5</td><td>6379/TCP</td><td>Edge RUM Service Server ⇄ Redis</td><td>Sliding-window rate limiting and API-key cache</td><td>Rate limiting and caching</td><td>Bilateral</td></tr>
<tr><td>6</td><td>8003/TCP</td><td>Gateway → (mTLS :8003) → RUM analytics microservice</td><td>mTLS-secured access to the RUM analytics microservice (Redis-backed)</td><td>Secure RUM analytics query access</td><td>Bilateral (mTLS)</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">On-premise deployments</span>The RUM Service Server does not require outbound internet access. RUM clients (browser and mobile) must reach it over HTTPS, and it must reach the internal Kafka, Redis, and PostgreSQL services.</div>
<h2>Sizing guidance</h2>
<div class="tblwrap"><table>
<tr><th>Deployment context</th><th>Component</th><th>CPU</th><th>Memory</th><th>Disk</th></tr>
<tr><td>Production &amp; POC</td><td>RUM Service Server</td><td>16–24 cores @ 2.4+ GHz</td><td>16 GB – 32 GB</td><td>500 GB – 1 TB (+ RAID)</td></tr>
</table></div>
<p>Sizing covers the RUM Service Server only. The collector also requires reachable Kafka, Redis, and PostgreSQL / TimescaleDB services, which carry their own capacity and sizing requirements.</p>
`},
{book:'trd', group:"Requirements", id:"trd-dmz", title:"DMZ Server (Optional — Segmented Deployment)", dek:"Only required for the segmented deployment option, where internet-facing components are isolated in a DMZ. Applies the same way to production and POC.", html:`
<div class="callout note"><span class="ctitle">Optional</span>This server is only required if the client selects the segmented deployment option. It is not needed for the single-host deployment.</div>
<p>The DMZ server is provisioned only when the client chooses the segmented deployment. In that model the internet-facing components (the Collector and Kafka) are isolated in a DMZ, while the internal components (the Processor, Redis, and the RUM Analytics API) run inside the bank network. The two zones communicate over Kafka on port 9093 using mTLS.</p>
<p>Clients that do not have a network-segmentation requirement can instead use the single-host deployment, where every component runs on one server inside the trusted bank network — in which case no DMZ server is required. The decision rests with the client: choose the DMZ option when regulatory or security policy requires internet-facing services to be separated from the internal bank network; otherwise the single-host deployment is sufficient.</p>
<h2>Recommended DMZ server specification</h2>
<div class="tblwrap"><table>
<tr><th>Resource</th><th>Specification</th></tr>
<tr><td>AWS instance type</td><td><code>m6i.xlarge</code></td></tr>
<tr><td>vCPU</td><td>4</td></tr>
<tr><td>RAM</td><td>16 GB</td></tr>
<tr><td>Network</td><td>Up to 12.5 Gbps</td></tr>
<tr><td>Root disk</td><td>50 GB SSD (gp3)</td></tr>
<tr><td>Data disk (Kafka)</td><td>500 GB SSD (gp3), separate volume</td></tr>
<tr><td>OS</td><td>Ubuntu 22.04 LTS</td></tr>
<tr><td>Public IP</td><td>1 × Elastic IP (static)</td></tr>
</table></div>
<h2>Network requirements</h2>
<ul>
<li>Inbound 443/TCP from internet (mobile devices)</li>
<li>Inbound 9093/TCP from the client's static IP only (Kafka consumer link)</li>
<li>Outbound to standard services (DNS, NTP, package updates)</li>
</ul>
`},
{book:'trd', group:"Platform", id:"trd-os", title:"Supported Operating Systems", dek:"Mandated OS per server role — the same list for production and POC.", html:`
<p>The Edge platform is designed to operate within enterprise environments with defined operating system requirements for each server role. To ensure platform stability, security compliance, and supportability, the following operating systems are mandated:</p>
<div class="tblwrap"><table>
<tr><th>Server component</th><th>Supporting operating system</th></tr>
<tr><td>Gateway/UI Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Edge Services Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Database Server</td><td>Windows Server (2019 or later recommended)</td></tr>
<tr><td>Edge Agent Host</td><td>Windows or Linux</td></tr>
<tr><td>Edge RUM Service Server</td><td>Linux (enterprise distribution recommended)</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>In a POC, the first three rows are the same combined server; the OS requirement is unchanged.</div>
`},
{book:'trd', group:"Platform", id:"trd-appservices", title:"App Services Breakdown", dek:"Each internal microservice, its default port, and exposure scope — the same in production and POC.", html:`
<p>The App Service Server (or, in a POC, the combined server) hosts multiple internal services, each operating on a dedicated port and restricted to internal access only.</p>
<div class="tblwrap compact"><table>
<tr><th>App service</th><th>Default port</th><th>Exposure</th></tr>
<tr><td><code>ingest</code></td><td>8081</td><td>Internal only (gateway → ingest)</td></tr>
<tr><td><code>control-plane</code></td><td>8082</td><td>Internal only</td></tr>
<tr><td><code>auth</code></td><td>8083</td><td>Internal only</td></tr>
<tr><td><code>query</code></td><td>8084</td><td>Internal only</td></tr>
<tr><td><code>alerting</code></td><td>8085</td><td>Internal only</td></tr>
<tr><td><code>agent-distribution</code></td><td>8086</td><td>Internal only</td></tr>
<tr><td><code>ai-insights</code></td><td>8087</td><td>Internal only</td></tr>
</table></div>
`},
{book:'trd', group:"Technology Support", id:"trd-techsupport", title:"Version Schema & Agent Platform Support", dek:"Version schema, supported operating systems, file systems, and network interfaces for the Edge Agent.", html:`
<h2>Version schema</h2>
<div class="tblwrap compact"><table>
<tr><th>Notation</th><th>Meaning</th></tr>
<tr><td>Major version — <code>5</code></td><td>All minor and patch versions supported (e.g. 5.1, 5.1.2)</td></tr>
<tr><td>Minor version — <code>5.1</code></td><td>Only that minor and its patch versions supported</td></tr>
<tr><td>Version range — <code>5.1 – 5.3</code></td><td>All minors in that range and their patches supported</td></tr>
<tr><td>Minimum version — <code>5+</code></td><td>All versions from 5 onwards supported</td></tr>
<tr><td>LTS</td><td>Long-Term Support release</td></tr>
<tr><td>EOL</td><td>End-of-life — best-effort only</td></tr>
</table></div>
<h2>Operating systems (Edge Agent)</h2>
<p>Only 64-bit environments are supported. Both x86-64 and ARM64 architectures are supported on Linux.</p>
<div class="tblwrap"><table>
<tr><th>Operating system</th><th>Supported versions</th><th>CPU architectures</th></tr>
<tr><td>Red Hat Enterprise Linux (RHEL)</td><td>7, 8, 9</td><td>x86-64</td></tr>
<tr><td>CentOS / CentOS Stream</td><td>7, Stream 8, Stream 9</td><td>x86-64</td></tr>
<tr><td>Rocky Linux</td><td>8, 9</td><td>x86-64</td></tr>
<tr><td>AlmaLinux</td><td>8, 9</td><td>x86-64</td></tr>
<tr><td>Ubuntu Server</td><td>18.04 LTS, 20.04 LTS, 22.04 LTS, 24.04 LTS</td><td>x86-64</td></tr>
<tr><td>Debian</td><td>10, 11, 12</td><td>x86-64</td></tr>
<tr><td>Oracle Linux</td><td>7, 8, 9</td><td>x86-64</td></tr>
<tr><td>Amazon Linux</td><td>2, 2023</td><td>x86-64</td></tr>
<tr><td>SUSE Linux Enterprise Server (SLES)</td><td>12 SP5, 15 SP4, 15 SP5, 15 SP6</td><td>x86-64</td></tr>
<tr><td>Windows Server</td><td>2016, 2019, 2022, 2025</td><td>x86-64</td></tr>
<tr><td>Windows Desktop</td><td>10 LTSC, 11 — dev/test only</td><td>x86-64</td></tr>
</table></div>
<div class="callout important"><span class="ctitle">Kernel & packages</span>Linux kernel 4.18+ required. Required packages: <code>systemd</code>, <code>curl</code>, <code>openssl</code>, <code>tar</code>, <code>gzip</code>, <code>iproute</code> or <code>net-tools</code>. The Edge Agent uses an offline installer — no Go toolchain or internet access is required on monitored hosts.</div>
<h2>File systems</h2>
<div class="tblwrap compact"><table>
<tr><th>File system</th><th>OS</th></tr>
<tr><td>btrfs, ext2/3/4, NFS, overlay, tmpfs, XFS, ZFS</td><td>Linux</td></tr>
<tr><td>NTFS, ReFS, FAT32 / exFAT</td><td>Windows</td></tr>
<tr><td>SMB / CIFS</td><td>Linux, Windows</td></tr>
</table></div>
<h2>Network interfaces</h2>
<ul>
<li>IEEE 802.3 Ethernet (physical and virtual)</li>
<li>IEEE 802.11 Wireless LAN</li>
<li>Bond interfaces (Linux bonding / Windows NIC teaming)</li>
<li>VLAN-tagged interfaces (802.1Q)</li>
<li>Virtual Ethernet (veth)</li>
</ul>
<p>Both physical and virtual interfaces are supported, provided they are not assigned a link-local address (IPv4 <code>169.254.1.0 – 169.254.254.255</code> and IPv6 <code>FE80::/10</code> are excluded). Only the TCP protocol is supported for traffic monitoring.</p>
<div class="callout link"><span class="ctitle">Full technology matrix</span>See <a class="inline" data-goto="poc-tech-langs">Languages, Frameworks &amp; Runtimes</a> for the full APM support matrix, and <a class="inline" data-goto="poc-tech-infra">Web Servers, Messaging Brokers &amp; OpenTelemetry</a> and <a class="inline" data-goto="poc-tech-cloud">Cloud Platforms, Integrations &amp; Protocols</a> for the rest of the supported stack.</div>
`},
{book:'trd', group:"Technology Support", id:"poc-tech-langs", title:"Languages, Frameworks & Runtimes", dek:"APM auto-instrumentation support across Java, .NET, Node.js, Python, and Go.", html:`
<p>Edge EPM supports APM monitoring — distributed tracing, error detection, and transaction performance visibility — for the languages and frameworks below. The Edge APM agent auto-instruments supported technologies automatically, with no code changes required.</p>
<h2>Java</h2>
<p>Instrumented automatically at the JVM level.</p>
<ul>
<li><strong>JVMs:</strong> Amazon Corretto, Eclipse Temurin (Adoptium), IBM Semeru, OpenJDK, Oracle HotSpot — 8/11/17/21 LTS (OpenJDK also 22, 23)</li>
<li><strong>Application servers:</strong> Apache Tomcat 6–11, IBM WebSphere Liberty 21.x–24.x, JBoss EAP 7/8, Oracle WebLogic 12c/14c, Payara 5/6/7, WildFly 18–32</li>
<li><strong>Web frameworks:</strong> Jakarta Servlet 2.5–6, Jetty 7–12, Micronaut 3.x/4.x, Quarkus 2.x/3.x, Spring Boot 2.7.x/3.0+, Spring MVC 5.x/6.x, Spring WebFlux 5/6/7, Vert.x HTTP Server 3.6+/4.x/5.x</li>
<li><strong>Messaging clients:</strong> ActiveMQ 4/5, ActiveMQ Artemis 1/2, IBM MQ client 8/9, JMS 1.1/2.0/3.0, Kafka 1.0+/2.x/3.x/4.x, RabbitMQ 3+/4.x/5.x</li>
<li><strong>Monitoring & logging:</strong> OpenTelemetry 1.0–1.60, Log4J2 2.7+, Logback 1.x, java.util.logging (all versions), JBoss LogManager 1.1+/2/3</li>
</ul>
<h2>.NET</h2>
<p>C# applications, instrumented automatically.</p>
<ul>
<li><strong>Runtime:</strong> .NET / .NET Core 3.1, 5, 6, 7, 8, 9 (Linux + Windows); .NET Framework 4.6.2, 4.7.x, 4.8.x (Windows only)</li>
<li><strong>Web frameworks:</strong> ASP.NET Core (all versions), ASP.NET Framework (all versions), HttpClient (all versions), gRPC 2.23.2+</li>
<li><strong>Messaging & logging:</strong> Confluent Kafka .NET 1.4.0+, IBM MQ client 8.0–9.1, RabbitMQ client 4.1–6.x/7.x+, OpenTelemetry 1.0.1+/1.1+, Microsoft Logging Extensions 3.0.0+, Serilog 2.9+, log4net 2.0.6+</li>
</ul>
<h2>Node.js</h2>
<p>Follows the Node.js LTS release schedule: 18 LTS, 20 LTS, 22 LTS on Linux and Windows (x86-64).</p>
<ul>
<li><strong>Web frameworks:</strong> Express 3/4, Fastify 3.3.0+, hapi 17+, Koa 7.0.0+, NestJS 6.0.0+, Next.js 13.x+, restify 4.1+</li>
<li><strong>Messaging & logging:</strong> KafkaJS 1.11+/2, RabbitMQ (amqplib) 0.2–0.10, OpenTelemetry 1, Bunyan 1+, log4js 6.0.0+, pino 5.14+/6+, winston 3</li>
</ul>
<h2>Python</h2>
<p>Supported runtime: CPython 3.8–3.13 on Linux and Windows (x86-64).</p>
<ul>
<li><strong>Web frameworks:</strong> aiohttp Server 3.6.1+, Django 1.8+ (incl. DRF), FastAPI 0.44+, Flask 1.1.2+, Sanic 22.12+, Starlette 0.12+, Tornado 6.0+</li>
<li><strong>HTTP, messaging & monitoring:</strong> aiohttp Client 3.0+, httpx 0.20.0+, Requests 2, urllib3 2.0+, Celery 5.3+, Confluent Kafka Python client 2.0.2+, kafka-python 1.4+, Kombu 4.6.7+, pika 1.0.0+, OpenTelemetry 1.0+</li>
</ul>
<h2>Go</h2>
<p>Edge follows the Go release policy and supports the last two stable major versions: official Golang toolchain 1.21–1.24 on Linux (x86-64). The application binary must be dynamically linked.</p>
<ul>
<li><strong>Frameworks & libraries:</strong> net/http (all versions), gRPC 1.17–1.80, Kafka (IBM/sarama) 1.40+, Kafka (confluentinc/confluent-kafka-go) 1.9–2.14, OpenTelemetry 1.0–1.43, Logrus 1.7.1–1.9, Zap 1.10–1.28, log/slog (all versions)</li>
</ul>
`},
{book:'trd', group:"Technology Support", id:"poc-tech-infra", title:"Web Servers, Messaging Brokers & OpenTelemetry", dek:"Broker- and server-level monitoring, plus native OTLP ingestion.", html:`
<h2>Web servers</h2>
<p>Edge monitors process health, active connections, request throughput, and error rates.</p>
<div class="tblwrap"><table>
<tr><th>Web server</th><th>Versions</th><th>OS</th><th>Notes</th></tr>
<tr><td>Apache HTTP Server</td><td>2.4.x</td><td>Linux, Windows</td><td><code>mod_status</code> endpoint required</td></tr>
<tr><td>NGINX</td><td>1.18+</td><td>Linux, Windows</td><td><code>ngx_http_stub_status_module</code> required</td></tr>
<tr><td>NGINX Plus</td><td>R24+</td><td>Linux</td><td>Metrics via <code>/api</code> endpoint</td></tr>
<tr><td>Microsoft IIS</td><td>8.5, 10.0</td><td>Windows</td><td>App pool, request queue, failed request monitoring</td></tr>
<tr><td>HAProxy</td><td>2.4+</td><td>Linux</td><td>Stats via stats socket</td></tr>
<tr><td>LiteSpeed</td><td>5.4+, 6.x</td><td>Linux</td><td>Stats via built-in admin interface</td></tr>
</table></div>
<h2>Messaging brokers</h2>
<p>Edge monitors queue depth, consumer lag, produce/consume rates, and error rates at the broker level (separate from the per-language client library support).</p>
<div class="tblwrap"><table>
<tr><th>System</th><th>Versions</th><th>OS</th><th>Collection method</th></tr>
<tr><td>Apache Kafka</td><td>2.8 – 3.7</td><td>Linux, Windows</td><td>JMX and Kafka AdminClient — broker, topic, consumer group metrics</td></tr>
<tr><td>RabbitMQ</td><td>3.10+</td><td>Linux, Windows</td><td>Management API — queue depth, message rates, node health</td></tr>
<tr><td>ActiveMQ</td><td>5.16+</td><td>Linux, Windows</td><td>JMX — broker and destination metrics</td></tr>
<tr><td>ActiveMQ Artemis</td><td>2.28+</td><td>Linux, Windows</td><td>Address, queue, and consumer metrics</td></tr>
<tr><td>IBM MQ</td><td>9.2+</td><td>Linux, Windows</td><td>Channel status, queue depth, listener health</td></tr>
</table></div>
<h2>OpenTelemetry</h2>
<p>Edge natively ingests OpenTelemetry signals over OTLP. Any application already instrumented with OTel SDKs can send traces, metrics, and logs directly into Edge without installing an Edge agent on those hosts.</p>
<div class="tblwrap compact"><table>
<tr><th>Protocol</th><th>OTel SDK version</th><th>Transport</th></tr>
<tr><td>OTLP/gRPC</td><td>1.x</td><td>gRPC — port 4317</td></tr>
<tr><td>OTLP/HTTP</td><td>1.x</td><td>HTTP/JSON — port 4318</td></tr>
</table></div>
<h2>Synthetic monitoring</h2>
<p>Edge Synthetic Monitoring executes scripted Playwright journeys from named runner locations inside your environment, providing availability and performance baselines independent of real user traffic.</p>
<ul>
<li><strong>Scripting framework:</strong> Playwright — multi-step browser journeys, form submission, navigation, clicks, and assertions</li>
<li><strong>Screenshot on failure:</strong> automatic screenshot capture attached to the alert when a step fails</li>
<li><strong>Trace logs:</strong> full execution trace including step timings and network requests per test run</li>
<li><strong>Early warning alerts:</strong> fire before real users are impacted, based on threshold or step-failure</li>
<li><strong>Runner platform:</strong> Windows Server only — Synthetic Runners run as Windows Services via WinSW</li>
<li><strong>Enrollment:</strong> each runner location requires a unique enrollment key from the Edge Super Admin console</li>
</ul>
<h2>Real User Monitoring (RUM)</h2>
<p>Edge RUM captures actual user behaviour from browsers using a lightweight JavaScript snippet. No agent installation is required on end-user devices.</p>
<div class="tblwrap compact"><table>
<tr><th>Feature</th><th>Detail</th></tr>
<tr><td>Page load performance</td><td>DNS, TCP, TLS handshake, TTFB, DOM processing, and fully loaded time</td></tr>
<tr><td>Core Web Vitals</td><td>LCP, FID, CLS, INP</td></tr>
<tr><td>Session breakdown</td><td>User journeys, click paths, page sequences, and session duration</td></tr>
<tr><td>JavaScript error tracking</td><td>Unhandled exceptions, promise rejections, and grouped stack traces</td></tr>
<tr><td>AJAX & API call tracing</td><td>XHR and Fetch request timing, status codes, and failure rates from the browser</td></tr>
<tr><td>Device & region analysis</td><td>Performance by browser, OS, device type, connection type, and region</td></tr>
</table></div>
`},
{book:'trd', group:"Technology Support", id:"poc-tech-cloud", title:"Cloud Platforms, Integrations & Protocols", dek:"AWS, Azure and GCP monitoring, plus the protocol integrations Edge natively ingests.", html:`
<h2>Cloud platforms</h2>
<p>Edge monitors cloud infrastructure through the Edge Agent deployed on cloud VM instances.</p>
<div class="tblwrap"><table>
<tr><th>Provider</th><th>Service</th><th>Monitoring type</th></tr>
<tr><td rowspan="4">AWS</td><td>EC2</td><td>Agent-based — CPU, memory, disk, network, status checks</td></tr>
<tr><td>RDS</td><td>Agent-based where accessible — database call tracing via APM agent</td></tr>
<tr><td>Elastic Load Balancing (ALB, NLB)</td><td>Infrastructure metrics via agent on target hosts</td></tr>
<tr><td>SQS</td><td>Queue depth and message metrics via agent</td></tr>
<tr><td rowspan="2">Azure</td><td>Virtual Machines</td><td>Agent-based — full host metrics</td></tr>
<tr><td>Azure Load Balancer</td><td>Infrastructure metrics via agent on target hosts</td></tr>
<tr><td>GCP</td><td>Compute Engine (GCE)</td><td>Agent-based — full host metrics on supported Linux / Windows VMs</td></tr>
</table></div>
<h2>Integrations & protocols</h2>
<div class="tblwrap"><table>
<tr><th>Integration</th><th>Version / protocol</th><th>Notes</th></tr>
<tr><td>OpenTelemetry (OTLP)</td><td>OTel SDK 1.x · OTLP/gRPC, OTLP/HTTP</td><td>Traces, metrics, and logs — normalised to Edge data model and stored in the Edge Data Lake</td></tr>
<tr><td>Prometheus scrape</td><td>Exposition format v0.0.4+</td><td>Edge scrapes any <code>/metrics</code> endpoint; data surfaced in dashboards</td></tr>
<tr><td>StatsD</td><td>StatsD protocol (UDP)</td><td>Custom metric ingestion via Edge StatsD listener</td></tr>
<tr><td>Syslog</td><td>RFC 3164 and RFC 5424</td><td>Log ingestion from rsyslog and syslog-ng on Linux hosts</td></tr>
<tr><td>SNMP</td><td>v2c, v3</td><td>Network device monitoring — switches, routers, printers</td></tr>
<tr><td>JMX</td><td>JMX remote protocol</td><td>Java application and middleware metrics via configurable MBean queries</td></tr>
<tr><td>WMI / Perf Counters</td><td>Native Windows APIs</td><td>Extended OS and application metrics on Windows hosts</td></tr>
<tr><td>WhatsApp (Ask Edge AI)</td><td>WhatsApp Business API</td><td>Incident notifications and chatbot-driven remediation</td></tr>
<tr><td>Webhook</td><td>HTTP POST — JSON payload</td><td>Alert delivery to Slack, Teams, PagerDuty, or any custom HTTP endpoint</td></tr>
<tr><td>Email (SMTP)</td><td>SMTP with TLS — port 587 or 465</td><td>Alert delivery via configured SMTP relay</td></tr>
</table></div>
`},
{book:'trd', group:"Edge Agent", id:"poc-agent-overview", title:"Agent Platforms & Windows Service Deployment", dek:"A statically linked, zero-dependency collector for host telemetry — distributed for Linux, Windows and AIX.", html:`
<p>The Edge Agent is a lightweight, self-contained host agent that is installed on each monitored server. It collects host-level telemetry (metrics, logs, process and service discovery), auto-instruments supported application runtimes for distributed tracing, and forwards all data securely to the Edge backend. The agent ships as a single statically linked binary with no external runtime dependencies and requires no internet access on the monitored host beyond the outbound connection to the Edge backend.</p>
<h2>Agent platforms & architectures</h2>
<div class="tblwrap"><table>
<tr><th>Platform</th><th>CPU architecture</th><th>Binary</th><th>Notes</th></tr>
<tr><td>Linux</td><td>x86-64 (amd64)</td><td><code>edge-agent</code></td><td>Primary Linux build; statically linked</td></tr>
<tr><td>Linux</td><td>ARM64 (aarch64)</td><td><code>edge-agent</code></td><td>For ARM-based servers and cloud instances</td></tr>
<tr><td>IBM AIX</td><td>PowerPC 64 (ppc64)</td><td><code>edge-agent</code></td><td>XCOFF executable for AIX on POWER</td></tr>
<tr><td>Windows</td><td>x86-64 (amd64)</td><td><code>edge-agent.exe</code></td><td>Runs as a Windows Service via WinSW</td></tr>
</table></div>
<p>All builds are 64-bit. The agent binary is statically linked and carries no Go toolchain or runtime dependency on the monitored host.</p>
<h2>Windows service deployment</h2>
<div class="tblwrap"><table>
<tr><th>Item</th><th>Requirement / value</th></tr>
<tr><td>Operating System</td><td>Windows Server 2019 / 2022, or Windows 10 and later</td></tr>
<tr><td>Privileges</td><td>Local Administrator (required for service installation)</td></tr>
<tr><td>Install path</td><td><code>C:\\edge-agent</code></td></tr>
<tr><td>Service wrapper</td><td>WinSW (<code>edge-agent-service.exe</code> / <code>edge-agent-service.xml</code>)</td></tr>
<tr><td>Install command</td><td><code>C:\\edge-agent\\scripts\\setup.cmd</code> (run as Administrator)</td></tr>
<tr><td>Service name</td><td><code>EDGE-Agent</code> (Startup type: Automatic)</td></tr>
<tr><td>Network</td><td>Outbound HTTPS (443) to the Edge backend</td></tr>
</table></div>
<h2>Agent network ports</h2>
<p>In addition to the outbound backend connection, the agent exposes local listeners used for application telemetry ingestion and agent self-monitoring.</p>
<div class="tblwrap"><table>
<tr><th>Port</th><th>Protocol</th><th>Direction</th><th>Purpose</th></tr>
<tr><td>443/TCP</td><td>HTTPS</td><td>Outbound</td><td>Agent to Edge backend — bootstrap, discovery, telemetry forwarding</td></tr>
<tr><td>4317/TCP</td><td>OTLP/gRPC</td><td>Local inbound</td><td>OTLP trace/metric/log ingestion from local applications</td></tr>
<tr><td>4318/TCP</td><td>OTLP/HTTP</td><td>Local inbound</td><td>OTLP HTTP/protobuf ingestion (includes <code>/v1/rum</code> endpoint)</td></tr>
<tr><td>9099/TCP</td><td>HTTP</td><td>Local inbound</td><td>Agent self-monitoring — Prometheus <code>/metrics</code> and <code>/healthz</code></td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>OTLP and self-monitoring listeners are bound for local application access only. The only required external connectivity is outbound 443/TCP to the Edge backend.</div>
<h2>Host identity & auto-update</h2>
<div class="tblwrap"><table>
<tr><th>Capability</th><th>Detail</th></tr>
<tr><td>Host identity</td><td>Persistent <code>host_uid.txt</code> — one per server; must never be copied between hosts</td></tr>
<tr><td>Agent identity</td><td>Persistent <code>agent_uid</code>; unique per installed agent instance</td></tr>
<tr><td>Tenant / environment</td><td>Each agent is bound to a tenant slug and environment name (e.g. Prod)</td></tr>
<tr><td>Auto-update</td><td>Signed release channel; update payloads verified with RSA-PSS-SHA256 signatures</td></tr>
<tr><td>TLS</td><td>CA-bundle trust for the backend connection; certificate verification enabled by default</td></tr>
</table></div>
`},
{book:'trd', group:"Edge Agent", id:"poc-agent-features", title:"Auto-Instrumentation, Discovery & RUM Injection", dek:"Zero-touch instrumentation, live service topology mapping, and optional RUM snippet injection.", html:`
<h2>Application auto-instrumentation</h2>
<p>The Edge Agent performs zero-touch application instrumentation. It scans running processes, identifies the runtime technology, checks whether OpenTelemetry is already present, and injects instrumentation without code changes. On Windows this is applied through machine-level environment variables so any newly started process is instrumented automatically.</p>
<div class="tblwrap"><table>
<tr><th>Runtime</th><th>Detection / injection mechanism</th><th>Notes</th></tr>
<tr><td>Java</td><td>Machine-level <code>JAVA_TOOL_OPTIONS</code> loads the OpenTelemetry Java agent</td><td>Applies to any Java process (Tomcat, Spring Boot, WildFly, custom jars)</td></tr>
<tr><td>.NET</td><td><code>CORECLR_*</code> and <code>DOTNET_*</code> profiler environment variables</td><td>Bundled OTel .NET store for net8.0, net9.0, net10.0; IIS, services, console apps</td></tr>
<tr><td>Python</td><td><code>opentelemetry-instrument</code> applied per application or virtualenv</td><td>Service name set per app/service; gRPC or HTTP exporter to local agent</td></tr>
<tr><td>Node.js</td><td>OpenTelemetry Node auto-instrumentation per service</td><td>Detected via process and command-line markers</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>No global <code>OTEL_SERVICE_NAME</code> is set machine-wide; service names are assigned per application to keep services correctly separated.</div>
<h2>Discovery, process groups & network topology</h2>
<div class="tblwrap"><table>
<tr><th>Capability</th><th>Detail</th></tr>
<tr><td>Service & port discovery</td><td>Periodic discovery of running services, listening ports, and dependencies</td></tr>
<tr><td>Process group classification</td><td>Classifies processes by technology (e.g. java:tomcat, dotnet:iis, web:nginx, db:postgresql, db:mysql, db:redis, mq:rabbitmq)</td></tr>
<tr><td>Network topology</td><td>Samples established TCP connections and builds a live service dependency map</td></tr>
<tr><td>Prometheus auto-discovery</td><td>Detects and scrapes local <code>/metrics</code> endpoints automatically</td></tr>
<tr><td>Log collection</td><td>Tails configured log files (e.g. Tomcat, IIS) with daily rotation and retention</td></tr>
<tr><td>Network Performance Monitoring</td><td>Bundled NPM sub-agent, supervised by the Edge Agent, for network-level metrics</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>Process-group and topology detection recognise common database engines (PostgreSQL, MySQL, Redis) at the process and port level for dependency mapping. This is distinct from deep database performance monitoring, which is not provided as a dedicated module.</div>
<h2>RUM injection (optional, Windows only)</h2>
<p>On Windows hosts serving web content, the agent can optionally inject the Real User Monitoring snippet into served pages. This is disabled by default because it modifies web files, and can be enabled per deployment.</p>
<div class="tblwrap"><table>
<tr><th>Item</th><th>Detail</th></tr>
<tr><td>Default state</td><td>Disabled (opt-in) — enabled via <code>EDGE_ENABLE_RUM_INJECTION</code></td></tr>
<tr><td>Targets</td><td>IIS auto-discovered web roots, plus any paths listed in <code>EDGE_RUM_WEBROOTS</code></td></tr>
<tr><td>File types</td><td><code>.html</code>, <code>.htm</code>, <code>.jsp</code>, <code>.aspx</code>, <code>.cshtml</code>, <code>.razor</code></td></tr>
<tr><td>Safety</td><td>Build/vendor folders skipped; backups created (<code>*.bak_edge_rum</code>); removable by markers</td></tr>
</table></div>
`},
{book:'trd', group:"Kubernetes", id:"poc-k8s", title:"Kubernetes Deployment Requirements", dek:"Service names, log paths, cluster dependencies, and the firewall exception request for agent DaemonSets.", html:`
<p>The Edge agent and its supporting microservices can be deployed into a Kubernetes cluster for full observability coverage. All ten components listed below must be reachable within the cluster for complete coverage.</p>
<h2>Kubernetes service names and namespaces</h2>
<div class="tblwrap compact"><table>
<tr><th>#</th><th>Service name</th><th>Namespace</th><th>Role</th></tr>
<tr><td>1</td><td><code>edge-agent</code> (DaemonSet)</td><td><code>edge-agent</code></td><td>Host and K8s telemetry collector</td></tr>
<tr><td>2</td><td><code>edge-ingest</code></td><td><code>edge-platform</code></td><td>Metrics, logs and trace ingestion</td></tr>
<tr><td>3</td><td><code>edge-control-plane</code></td><td><code>edge-platform</code></td><td>Agent config and orchestration</td></tr>
<tr><td>4</td><td><code>edge-auth</code></td><td><code>edge-platform</code></td><td>Authentication and token validation</td></tr>
<tr><td>5</td><td><code>edge-query</code></td><td><code>edge-platform</code></td><td>Query engine / dashboard data</td></tr>
<tr><td>6</td><td><code>edge-alerting</code></td><td><code>edge-platform</code></td><td>Alert rules and notification dispatch</td></tr>
<tr><td>7</td><td><code>edge-agent-distribution</code></td><td><code>edge-platform</code></td><td>Binary distribution and auto-update</td></tr>
<tr><td>8</td><td><code>edge-ai-insights</code></td><td><code>edge-platform</code></td><td>AI/ML anomaly and insight engine</td></tr>
<tr><td>9</td><td><code>kube-state-metrics</code></td><td><code>monitoring</code></td><td>K8s object state metrics (KSM)</td></tr>
<tr><td>10</td><td><code>node-exporter</code></td><td><code>monitoring</code></td><td>Node-level hardware and OS metrics</td></tr>
</table></div>
<h2>Log file paths</h2>
<h3>On-premises server</h3>
<div class="tblwrap compact"><table>
<tr><th>Log source</th><th>File path</th></tr>
<tr><td>System log</td><td><code>/var/log/syslog</code></td></tr>
<tr><td>Kernel log</td><td><code>/var/log/kern.log</code></td></tr>
<tr><td>Edge agent runtime</td><td><code>/opt/edge-agent/runtime_logs/*.log</code></td></tr>
<tr><td>Container/pod logs</td><td><code>/var/log/containers/*.log</code> and <code>/var/log/pods/**/*.log</code></td></tr>
</table></div>
<h3>Azure server</h3>
<div class="tblwrap compact"><table>
<tr><th>Log source</th><th>File path</th></tr>
<tr><td>System log (rsyslog)</td><td><code>/var/log/syslog</code></td></tr>
<tr><td>Azure Diagnostics agent</td><td><code>/var/log/azure/*.log</code></td></tr>
<tr><td>Edge agent runtime</td><td><code>/opt/edge-agent/runtime_logs/*.log</code></td></tr>
<tr><td>AKS container/pod logs</td><td><code>/var/log/containers/*.log</code> and <code>/var/log/pods/**/*.log</code></td></tr>
<tr><td>OMS / Azure Monitor agent</td><td><code>/var/opt/microsoft/omsagent/log/*.log</code></td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>Log paths are configured in the <code>edge-agent</code> ConfigMap and can be customised per environment before deployment.</div>
<h2>kube-state-metrics and node-exporter cluster status</h2>
<p>Both components are required for the Edge platform to collect Kubernetes health data, restart events, and node-level metrics.</p>
<div class="tblwrap"><table>
<tr><th>Component</th><th>Required for</th><th>Action required</th></tr>
<tr><td>kube-state-metrics</td><td>Pod and deployment health, restart tracking, OOMKilled detection, RCA analysis</td><td>Confirm if already deployed (namespace: <code>monitoring</code> or <code>kube-system</code>). If absent, Edge requires permission to deploy via Helm chart.</td></tr>
<tr><td>node-exporter</td><td>CPU, memory, disk, and network metrics at node level</td><td>Confirm if already deployed. If absent, Edge requires permission to deploy as a DaemonSet in the <code>monitoring</code> namespace.</td></tr>
</table></div>
<div class="callout important"><span class="ctitle">Action needed</span>Please respond with one of: (a) already deployed; (b) not deployed, permission granted to deploy; or (c) not deployed, requires internal approval process.</div>
<h2>Network firewall exception request</h2>
<p>For the Edge agent to send telemetry data to the Edge backend, the following outbound access must be permitted from all cluster nodes running the agent DaemonSet. No inbound ports need to be opened on the client cluster; all communication is outbound, initiated by the agent.</p>
<div class="tblwrap"><table>
<tr><th>Direction</th><th>Source</th><th>Destination</th><th>Port / protocol</th><th>Purpose</th></tr>
<tr><td>Outbound</td><td>All cluster nodes (edge-agent DaemonSet)</td><td>Edge Platform backend (IP provided post-onboarding)</td><td>443/TCP (HTTPS)</td><td>Agent bootstrap, metric push, log and trace ingestion</td></tr>
<tr><td>Outbound</td><td>All cluster nodes</td><td>Internal K8s API server</td><td>6443/TCP</td><td>kube-state-metrics and cluster state queries</td></tr>
<tr><td>Outbound</td><td>Edge backend</td><td>Cluster ingress or node IPs</td><td>4317, 4318/TCP</td><td>OTLP trace and metric receiver (optional; only if push-mode APM is configured)</td></tr>
</table></div>
<div class="callout note"><span class="ctitle">Note</span>Exact Edge backend IP addresses will be provided by the Edge team upon environment provisioning.</div>
`},
{book:'trd', group:"Reference", id:"trd-security", title:"Security & Network Considerations", dek:"The baseline security posture every Edge deployment follows, in both topologies.", html:`

<li>Only HTTPS access is exposed to users</li>
<li>Role-based access and network segmentation are strongly recommended</li>

];

/* ============ BUILD NAV ============
   Document = static label (like a category heading).
   Group    = collapsible item with its own chevron (collapsed by default).
   Page     = leaf link shown once its group is expanded. */
const tree = document.getElementById('tree');
function renderNav(){
  tree.innerHTML = '';
  DOCS.forEach(doc=>{
    const section = document.createElement('div');
    section.className = 'docsection';
    section.dataset.doc = doc.id;

    const label = document.createElement('div');
    label.className = 'doclabel';
    label.textContent = doc.label;
    section.appendChild(label);

    const groups = {};
    PAGES.filter(p=>p.book===doc.id).forEach(p=>{ (groups[p.group] = groups[p.group]||[]).push(p); });
    Object.keys(groups).forEach(g=>{
      const item = document.createElement('div');
      item.className = 'navitem collapsed';

      const head = document.createElement('div');
      head.className = 'itemhead';
      head.innerHTML = `<span style="flex:1">${g}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>`;
      head.addEventListener('click', ()=> item.classList.toggle('collapsed'));
      item.appendChild(head);

      const body = document.createElement('div');
      body.className = 'itembody';
      groups[g].forEach(p=>{
        const a = document.createElement('a');
        a.className='navlink';
        a.dataset.id=p.id;
        a.textContent=p.title;
        a.addEventListener('click',()=>go(p.id));
        body.appendChild(a);
      });
      item.appendChild(body);
      section.appendChild(item);
    });
    tree.appendChild(section);
  });
}
document.getElementById('brandLink').addEventListener('click', ()=>go('doc-index'));
function expandSectionFor(id){
  const navEl = document.querySelector(`.navlink[data-id="${id}"]`);
  const item = navEl ? navEl.closest('.navitem') : null;
  if(item) item.classList.remove('collapsed');
}

/* ============ BUILD PAGES (all documents, in main) ============ */
const main = document.getElementById('main');
function docLabel(bookId){
  const d = DOCS.find(x=>x.id===bookId);
  return d ? d.label : 'Home';
}
PAGES.forEach((p)=>{
  const bookPages = PAGES.filter(x=>x.book===p.book);
  const idxInBook = bookPages.indexOf(p);
  const prevP = bookPages[idxInBook-1];
  const nextP = bookPages[idxInBook+1];
  const sec = document.createElement('section');
  sec.className='page';
  sec.id='page-'+p.id;
  sec.dataset.book = p.book;
  if(p.book==='home'){
    sec.innerHTML = p.html;
  } else {
    const crumb = `${docLabel(p.book)} <span style="opacity:.4">/</span> ${p.group} <span style="opacity:.4">/</span> <b>${p.title}</b>`;
    sec.innerHTML = `
      <div class="crumb">${crumb}</div>
      <h1>${p.title}</h1>
      ${p.dek ? `<p class="dek">${p.dek}</p>` : ''}
      ${p.html}
      <div class="pager">
        ${prevP ? `<a class="prev" data-nav="${prevP.id}"><span class="dir">← Previous</span>${prevP.title}</a>` : `<span></span>`}
        ${nextP ? `<a class="next" data-nav="${nextP.id}"><span class="dir">Next →</span>${nextP.title}</a>` : `<span></span>`}
      </div>
    `;
  }
  main.appendChild(sec);
});

function idFromGoto(str){
  // supports plain "pageId" or legacy "book:pageId" — only the id matters now
  return str.includes(':') ? str.split(':')[1] : str;
}

main.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav); window.scrollTo({top:0}); }
  const goto = e.target.closest('[data-goto]');
  if(goto){ go(idFromGoto(goto.dataset.goto)); window.scrollTo({top:0}); }
  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){
    const pre = copyBtn.closest('pre');
    const clone = pre.cloneNode(true);
    clone.querySelectorAll('button,.lbl').forEach(n=>n.remove());
    const text = clone.textContent.trim();
    navigator.clipboard?.writeText(text).then(()=>{
      const orig = copyBtn.textContent;
      copyBtn.textContent='Copied';
      setTimeout(()=>copyBtn.textContent=orig,1200);
    }).catch(()=>{});
  }
});

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navlink').forEach(a=>a.classList.remove('active'));
  const pageEl = document.getElementById('page-'+id);
  if(pageEl) pageEl.classList.add('active');
  if(id!=='doc-index'){
    expandSectionFor(id);
    const navEl = document.querySelector(`.navlink[data-id="${id}"]`);
    if(navEl){ navEl.classList.add('active'); navEl.scrollIntoView({block:'nearest'}); }
  }
  closeSidebar();
  location.hash = id;
}

/* ============ SEARCH (spans every document) ============ */
const results = document.getElementById('results');
const input = document.getElementById('searchInput');
const searchwrap = document.getElementById('searchwrap');

function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent.replace(/\s+/g,' ').trim();
}
const INDEX = PAGES.map(p=>({
  id:p.id, book:p.book, group:p.group, title:p.title,
  bookLabel: docLabel(p.book),
  text:(p.title+' '+(p.dek||'')+' '+stripHtml(p.html)).toLowerCase()
}));

function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ results.classList.remove('show'); results.innerHTML=''; searchwrap.classList.remove('has-val'); return; }
  searchwrap.classList.add('has-val');
  const hits = INDEX.filter(e=>e.text.includes(q)).slice(0,25);
  results.classList.add('show');
  if(!hits.length){ results.innerHTML = `<div class="none">No matches for "${escapeHtml(q)}"</div>`; return; }
  results.innerHTML = hits.map(h=>{
    const idx = h.text.indexOf(q);
    const start = Math.max(0, idx-28);
    const snippet = (start>0?'…':'') + escapeHtml(h.text.slice(start, idx+q.length+40)) + '…';
    const marked = snippet.replace(new RegExp(escapeRegExp(escapeHtml(q)),'i'), m=>`<b>${m}</b>`);
    return `<button class="rline" data-goto2="${h.id}"><span class="book">${h.bookLabel}</span><span>${h.title}</span><span class="path">${h.group||'Overview'} — ${marked}</span></button>`;
  }).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

input.addEventListener('input', ()=>doSearch(input.value));
results.addEventListener('click', e=>{
  const btn = e.target.closest('[data-goto2]');
  if(btn){ go(btn.dataset.goto2); window.scrollTo({top:0}); input.value=''; doSearch(''); }
});
document.getElementById('clearSearch').addEventListener('click', ()=>{ input.value=''; doSearch(''); input.focus(); });

/* ============ MOBILE MENU ============ */
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click', ()=>{
  sidebar.classList.add('open'); scrim.classList.add('show');
});
function closeSidebar(){
  if(window.innerWidth<=860){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
}
scrim.addEventListener('click', closeSidebar);

/* ============ DESKTOP SIDEBAR COLLAPSE ============ */
document.getElementById('collapseBtn').addEventListener('click', ()=>{
  document.body.classList.add('sidebar-collapsed');
});
document.getElementById('expandTab').addEventListener('click', ()=>{
  document.body.classList.remove('sidebar-collapsed');
});

/* ============ Ctrl/Cmd+K TO FOCUS SEARCH ============ */
const isMac = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'');
document.getElementById('modKey').textContent = isMac ? '⌘' : 'Ctrl';
document.addEventListener('keydown', e=>{
  const key = e.key ? e.key.toLowerCase() : '';
  if((e.ctrlKey||e.metaKey) && key==='k'){
    e.preventDefault();
    input.focus();
    input.select();
  }
  if(e.key==='Escape' && document.activeElement===input){
    input.value=''; doSearch(''); input.blur();
  }
});

/* ============ INIT ============ */
renderNav();
const hash = (location.hash||'').replace('#','');
const startId = PAGES.some(p=>p.id===hash) ? hash : 'doc-index';
go(startId);
</script>
</body>
