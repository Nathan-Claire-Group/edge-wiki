<p class="figcap">Split servers: a gateway server for users, and the hub running the backend and database.</p>
<ol>
<li>In the installer, or in <strong>Browse all products</strong>, enter the second server's IP when it asks for the <strong>UI/Gateway server</strong> for EDGE-PLATFORM. For the <strong>Services (App) server</strong>, press <strong>Enter</strong> to keep it on this machine. The installer warns you if you move Services off the hub, because the App server normally lives on the machine that downloads updates.</li>
<li>Answer the OS question for the gateway server. The hub builds a bundle for it. Install the satellite agent there as described in <a class="inline" data-goto="pcp-satellite-install">Installing the Satellite Agent</a>.</li>
<li>Set the role on each server: <code>"role": "app_server"</code> in the hub's file, and <code>"role": "gateway"</code> in the gateway server's file. The table below shows where each file is.</li>
<li>Fill in the rest of each file. Use the same <code>jwt_secret</code> everywhere, make sure <code>database</code> points at the server that runs PostgreSQL, and give <code>ssl</code> the certificate paths on the server that serves HTTPS.</li>
<li>Apply each server's configuration, as shown in the table below.</li>
</ol>
<h2>Where each server's configuration lives</h2>
<div class="tblwrap"><table>
<tr><th>Server</th><th>File</th><th>How to apply it</th></tr>
<tr><td><strong>The hub</strong></td><td><code>C:\\EdgeAPM_control_agent\\configs\\EDGE-PLATFORM\\prod_config.json</code></td><td><strong>Regenerate Config</strong>, then <strong>Apply Config and Install Services</strong>.</td></tr>
<tr><td><strong>Each other server</strong></td><td><code>C:\\EdgeAPM_control_agent\\configs\\EDGE-PLATFORM\\targets\\&lt;server-ip&gt;\\prod_config.json</code>, kept on the hub</td><td><strong>Apply Config and Install Services</strong> on that server's row.</td></tr>
</table></div>
<p>A satellite has no dashboard of its own, so you edit its configuration on the hub. The hub creates that file the first time the product is routed to the server, already set to the matching role and to <code>"topology": "split_gateway"</code>. It never overwrites a file you have edited.</p>
<h2>What the platform does for you</h2>
<ul>
<li>On the gateway server, nginx's upstream addresses are rewritten to the <strong>App server's IP</strong> — the address you gave for the Services part — so requests reach the backend. If that address were missing they would stay at <code>127.0.0.1</code>, which is wrong for the gateway role.</li>
<li>On the gateway server every backend service is stopped, never disabled, so only the gateway and the dashboard run.</li>
<li>On the App server the gateway is also configured and running, and nothing is stopped.</li>
<li>Your values are written into EDGE-PLATFORM's own configuration files by patching them in place, so anything that later versions add to those files is preserved.</li>
</ul>
`},
{book:'pcp', group:"EDGE-PLATFORM Layouts", id:"pcp-choose", title:"Choosing a Layout", dek:"Single vs. split, how updates work across servers, and fixing the most common role mistakes.", html:`
<h2>Which one should I choose?</h2>
<div class="tblwrap"><table>
<tr><th></th><th>Single server</th><th>Split servers</th></tr>
<tr><td><strong>Servers needed</strong></td><td>One: the hub.</td><td>Two or more: the hub and a gateway server.</td></tr>
<tr><td><strong>Installer answers</strong></td><td>Enter for every server question.</td><td>The gateway server's IP for UI/Gateway, Enter for Services.</td></tr>
<tr><td><code>role</code></td><td><code>all</code></td><td>Hub: <code>app_server</code>. Gateway server: <code>gateway</code>.</td></tr>
<tr><td><strong>Configuration files</strong></td><td>One <code>prod_config.json</code>.</td><td>One per server. The hub's own, plus one on the hub for each other server.</td></tr>
<tr><td><strong>Satellite relay (port 52002)</strong></td><td>Not opened.</td><td>Opened on the hub.</td></tr>
<tr><td><strong>Updates</strong></td><td>The hub applies the update.</td><td>The hub applies its part and sends the update to each other server.</td></tr>
<tr><td><strong>Choose it when</strong></td><td>You want the simplest set-up.</td><td>You want the web front end on its own server.</td></tr>
</table></div>
<h2>Updates and rollback with several servers</h2>
<p>The hub downloads each update once. It applies it to itself, and for every other server it sends the package and waits for that server to apply it. The dashboard shows the progress as <strong>Sending update to &lt;ip&gt;…</strong> and then <strong>Waiting for &lt;ip&gt; to apply the update…</strong>. Rollback works the same way: the hub rolls itself back and asks each other server to do the same. Each server's EDGE-PLATFORM folder is replaced as a single unit.</p>
<div class="callout important"><span class="ctitle">Keep the roles right when you add or move servers</span>Role is a value you type, not something detected. If a server is sent the Services part but its file says <code>gateway</code>, its backend will be stopped and the platform will not work. Correct the role in that server's <code>prod_config.json</code> and apply the configuration again.</div>
<div class="callout note"><span class="ctitle">Only one server question for EDGE-PLATFORM?</span>If the installer asks for just one server when you choose EDGE-PLATFORM, your environment has been registered as a single-server product. Ask NCG Africa to enable the split option before you plan a split deployment.</div>
<h2>Troubleshooting EDGE-PLATFORM</h2>
<div class="tblwrap"><table>
<tr><th>Symptom</th><th>Likely cause</th><th>What to do</th></tr>
<tr><td><strong>The gateway page opens but the data does not load (split)</strong></td><td>The gateway server's upstreams still point at <code>127.0.0.1</code>, because the Services server's IP was not known when the configuration was applied.</td><td>Check the IP you gave for the Services part, then apply the configuration to the gateway server again.</td></tr>
<tr><td><strong>Backend services are running on the gateway server</strong></td><td>That server's <code>role</code> is <code>all</code> or <code>app_server</code>.</td><td>Set <code>"role": "gateway"</code> in its file on the hub and apply again.</td></tr>
<tr><td><strong>Backend services are stopped on the App server</strong></td><td>Its <code>role</code> is <code>gateway</code>.</td><td>Set <code>"role": "app_server"</code> (split) or <code>"all"</code> (single) and apply again.</td></tr>
<tr><td><strong>Changes to a satellite's settings have no effect</strong></td><td>The wrong file was edited.</td><td>Edit the file under <code>configs\\EDGE-PLATFORM\\targets\\&lt;ip&gt;</code> on the hub, then click <strong>Apply Config and Install Services</strong> on that server's row.</td></tr>
</table></div>
`},
{book:'pcp', group:"Alerts & Visibility", id:"pcp-emails", title:"Email Alerts: New Products and Versions", dek:"Your hub checks in with NCG Africa regularly; when something new is available to you, the control server emails you.", html:`
<p>When NCG Africa has made something available to you that you do not have yet, the control server emails you, so you hear about it even if nobody is looking at the dashboard.</p>
<h2>When an email is sent</h2>
<div class="tblwrap"><table>
<tr><th>Situation</th><th>The email</th></tr>
<tr><td>NCG Africa adds a <strong>product you do not have</strong>.</td><td>Subject: <code>New version available — &lt;product&gt; v&lt;version&gt;</code></td></tr>
<tr><td>NCG Africa adds a <strong>newer version</strong>, or a <strong>new release</strong>, of a product you already run.</td><td>The same email.</td></tr>
<tr><td>A product finishes downloading and its services start on one of your servers.</td><td>Subject: <code>Setup completed — &lt;product&gt; on &lt;server IP&gt;</code></td></tr>
</table></div>
<ul>
<li>The email is sent when your hub confirms the product is available to you. That can be later than the moment NCG Africa registers it.</li>
<li>You receive it <strong>once</strong> for each product version. The same version never triggers a second email, however often your hub checks.</li>
<li>The wording is the same for a brand-new product and for a newer version of one you run. The dashboard tells them apart.</li>
</ul>
<h2>Who receives it</h2>
<p>Your organisation's contact email — the one you gave the installer — and anyone on your account whom NCG Africa has subscribed to this alert. An address that appears twice receives one copy.</p>

<p class="figcap">Example: the email for a product called edge_db. Yours shows your organisation, product, release and version.</p>
<div class="tblwrap"><table>
<tr><th>Part</th><th>What it says</th></tr>
<tr><td><strong>Subject</strong></td><td><code>New version available — &lt;product&gt; v&lt;version&gt;</code></td></tr>
<tr><td><strong>Heading</strong></td><td><code>&lt;product&gt; &lt;release&gt; v&lt;version&gt; is now available</code></td></tr>
<tr><td><strong>Opening line</strong></td><td><code>A new version is available for &lt;your organisation&gt;.</code></td></tr>
<tr><td><strong>Details</strong></td><td>Client (your organisation), Product, Branch (the release) and Version.</td></tr>
<tr><td><strong>Button</strong></td><td><strong>View in Edge APM</strong> opens the Products page, <code>https://product-control.ncgafrica.com/products</code>, with that product highlighted. To install or update, use your local dashboard (<code>http://127.0.0.1:5001</code>).</td></tr>
<tr><td><strong>Footer</strong></td><td>NCG AFRICA · EDGE APM CONTROL SERVER, the date and time (UTC), and “This is an automated message.”</td></tr>
</table></div>
<h2>What to do when it arrives</h2>
<ol>
<li>Open your local dashboard at <code>http://127.0.0.1:5001</code> on the hub.</li>
<li>On <strong>Overview</strong>, the <strong>Updates</strong> and <strong>New products</strong> cards show what is waiting.</li>
<li>For a <strong>new product</strong>, open <strong>Catalog</strong>, choose it, enter the server for each part (Enter keeps it on the hub), and install.</li>
<li>For a <strong>newer version</strong> of something you run, open <strong>Updates</strong> and click <strong>Update now</strong> when you are ready. Nothing forces an update.</li>
<li>When the product is installed and its services have started, you receive the “Setup completed” email.</li>
</ol>
<div class="callout success"><span class="ctitle">Not receiving the emails?</span>Check your junk folder first. Then ask NCG Africa to confirm the contact email on your account. Remember that each version is only emailed once.</div>
`},
{book:'pcp', group:"Alerts & Visibility", id:"pcp-ncg-sees", title:"What NCG Africa Sees and Does", dek:"NCG Africa sees your hub's heartbeat, the versions you have installed, and your monitoring and alerts.", html:`
<p>NCG Africa also registers new versions for you and sets your <strong>certificate policy</strong>, which controls how strictly your hub's identity is checked:</p>
<div class="tblwrap"><table>
<tr><th>Policy</th><th>What the server does</th></tr>
<tr><td><strong>Off</strong></td><td>Certificates are ignored. Your hub's token alone authenticates it.</td></tr>
<tr><td><strong>Optional</strong> (default)</td><td>A certificate is not demanded. If one is presented, it must be your hub's current certificate.</td></tr>
<tr><td><strong>Required</strong></td><td>No valid certificate means no access, even with a correct token. It is only set after your hub has presented its certificate successfully, and it is not suitable behind a TLS-inspecting proxy.</td></tr>
</table></div>
`},
{book:'pcp', group:"Reference", id:"pcp-troubleshooting", title:"Troubleshooting", dek:"Symptoms, likely causes and fixes for the installer, hub and satellites.", html:`
<div class="tblwrap"><table>
<tr><th>Symptom</th><th>Likely cause</th><th>What to do</th></tr>
<tr><td><strong>The installer cannot reach the server</strong></td><td>Outbound port 443 is blocked, or a proxy is in the way.</td><td>Ask your network team to allow <code>product-control.ncgafrica.com</code> on port 443 from the hub. If a proxy decrypts HTTPS, tell NCG Africa.</td></tr>
<tr><td><strong>Certificate or TLS errors, but the network looks fine</strong></td><td>The server clock is wrong.</td><td>Fix time synchronisation on the hub, then run the installer again.</td></tr>
<tr><td><strong>“Did not respond to ping” during setup</strong></td><td>The server is off, on another network, or blocks ping.</td><td>Continue only if you are sure the hub can reach it over the LAN. Otherwise correct the IP address.</td></tr>
<tr><td><strong>Not visible to NCG Africa after a few minutes</strong></td><td>The agent service is stopped or cannot reach the control server.</td><td>Check <code>EdgeAPM_Control_Agent</code> is <strong>Running</strong> in <code>services.msc</code>, and that outbound 443 is open.</td></tr>
<tr><td><strong>Shows offline after working</strong></td><td>No heartbeat for about 15 minutes.</td><td>Check the service and the hub's internet access.</td></tr>
<tr><td><strong>A satellite cannot reach the hub</strong></td><td>Port 52002 is blocked on the LAN.</td><td>Allow TCP 52002 from the satellites to the hub.</td></tr>
<tr><td><strong>The <code>satellite_bundles</code> folder does not exist</strong></td><td>No other server has been named yet.</td><td>Name the server in the installer or in <strong>Browse all products</strong>. The hub then builds the bundle.</td></tr>
<tr><td><strong>A server shows no agent yet</strong></td><td>The satellite agent is not installed, is not running, or cannot reach the hub.</td><td>Run the bundle's installer on that server, check its service is running, and allow TCP 52002 to the hub.</td></tr>
<tr><td><strong>A satellite shows offline</strong></td><td>It has stopped checking in.</td><td>Check its service (<code>EdgeAPM_Satellite</code> or <code>edge-satellite</code>) and the LAN path to the hub.</td></tr>
<tr><td><strong>A bundle contains <code>README_MISSING_ASSET.txt</code></strong></td><td>The hub was missing a satellite file when it built the bundle.</td><td>Send NCG Africa the text of that file.</td></tr>
<tr><td><strong>A product stays “pending” for another server</strong></td><td>The installer said “satellite deployment will handle it there”, and that server has no satellite agent yet.</td><td>Install the satellite agent from the bundle. The hub then delivers the product.</td></tr>
<tr><td><strong>The installer refuses an install folder</strong></td><td>The folder already exists, is not empty, and is not one the platform recorded, so it will not delete it.</td><td>Choose an empty or different location, or clear the folder yourself if you are sure it is safe.</td></tr>
<tr><td><strong>No email arrived for a new product</strong></td><td>Junk folder, a different contact email, or that version was already emailed once.</td><td>Check junk, then ask NCG Africa to confirm your contact email.</td></tr>
</table></div>
<div class="callout success"><span class="ctitle">Still stuck?</span>Send NCG Africa the installer's <strong>exact console output</strong>. The exact wording of an error is the fastest route to a fix.</div>
`},
{book:'pcp', group:"Reference", id:"pcp-key-details", title:"Key Details", dek:"Paths, ports, services and names in one place.", html:`
<div class="tblwrap"><table>
<tr><th>Item</th><th>Value</th></tr>
<tr><td><strong>Control server</strong></td><td><code>https://product-control.ncgafrica.com</code></td></tr>
<tr><td><strong>Outbound requirement</strong></td><td>HTTPS (443), from the hub only</td></tr>
<tr><td><strong>Agent folder</strong></td><td><code>C:\\EdgeAPM_control_agent</code></td></tr>
<tr><td><strong>Agent configuration</strong></td><td><code>config.json</code> and <code>state.json</code>, in the agent folder</td></tr>
<tr><td><strong>Product configuration</strong></td><td><code>C:\\EdgeAPM_control_agent\\configs\\&lt;product&gt;\\prod_config.json</code></td></tr>

/* ============ BUILD NAV ============
   Document = static label (like a category heading).
   Group    = collapsible item with its own chevron (collapsed by default).
   Page     = leaf link shown once its group is expanded. */
const tree = document.getElementById('tree');
function renderNav(){
  tree.innerHTML = '';
  DOCS.forEach(doc=>{
    const section = document.createElement('div');
    section.className = 'docsection';
    section.dataset.doc = doc.id;

    const label = document.createElement('div');
    label.className = 'doclabel';
    label.textContent = doc.label;
    section.appendChild(label);

    const groups = {};
    PAGES.filter(p=>p.book===doc.id).forEach(p=>{ (groups[p.group] = groups[p.group]||[]).push(p); });
    Object.keys(groups).forEach(g=>{
      const item = document.createElement('div');
      item.className = 'navitem collapsed';

      const head = document.createElement('div');
      head.className = 'itemhead';
      head.innerHTML = `<span style="flex:1">${g}</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>`;
      head.addEventListener('click', ()=> item.classList.toggle('collapsed'));
      item.appendChild(head);

      const body = document.createElement('div');
      body.className = 'itembody';
      groups[g].forEach(p=>{
        const a = document.createElement('a');
        a.className='navlink';
        a.dataset.id=p.id;
        a.textContent=p.title;
        a.addEventListener('click',()=>go(p.id));
        body.appendChild(a);
      });
      item.appendChild(body);
      section.appendChild(item);
    });
    tree.appendChild(section);
  });
}
document.getElementById('brandLink').addEventListener('click', ()=>go('doc-index'));
function expandSectionFor(id){
  const navEl = document.querySelector(`.navlink[data-id="${id}"]`);
  const item = navEl ? navEl.closest('.navitem') : null;
  if(item) item.classList.remove('collapsed');
}

/* ============ BUILD PAGES (all documents, in main) ============ */
const main = document.getElementById('main');
function docLabel(bookId){
  const d = DOCS.find(x=>x.id===bookId);
  return d ? d.label : 'Home';
}
PAGES.forEach((p)=>{
  const bookPages = PAGES.filter(x=>x.book===p.book);
  const idxInBook = bookPages.indexOf(p);
  const prevP = bookPages[idxInBook-1];
  const nextP = bookPages[idxInBook+1];
  const sec = document.createElement('section');
  sec.className='page';
  sec.id='page-'+p.id;
  sec.dataset.book = p.book;
  if(p.book==='home'){
    sec.innerHTML = p.html;
  } else {
    const crumb = `${docLabel(p.book)} <span style="opacity:.4">/</span> ${p.group} <span style="opacity:.4">/</span> <b>${p.title}</b>`;
    sec.innerHTML = `
      <div class="crumb">${crumb}</div>
      <h1>${p.title}</h1>
      ${p.dek ? `<p class="dek">${p.dek}</p>` : ''}
      ${p.html}
      <div class="pager">
        ${prevP ? `<a class="prev" data-nav="${prevP.id}"><span class="dir">← Previous</span>${prevP.title}</a>` : `<span></span>`}
        ${nextP ? `<a class="next" data-nav="${nextP.id}"><span class="dir">Next →</span>${nextP.title}</a>` : `<span></span>`}
      </div>
    `;
  }
  main.appendChild(sec);
});

function idFromGoto(str){
  // supports plain "pageId" or legacy "book:pageId" — only the id matters now
  return str.includes(':') ? str.split(':')[1] : str;
}

main.addEventListener('click', e=>{
  const nav = e.target.closest('[data-nav]');
  if(nav){ go(nav.dataset.nav); window.scrollTo({top:0}); }
  const goto = e.target.closest('[data-goto]');
  if(goto){ go(idFromGoto(goto.dataset.goto)); window.scrollTo({top:0}); }
  const copyBtn = e.target.closest('[data-copy]');
  if(copyBtn){
    const pre = copyBtn.closest('pre');
    const clone = pre.cloneNode(true);
    clone.querySelectorAll('button,.lbl').forEach(n=>n.remove());
    const text = clone.textContent.trim();
    navigator.clipboard?.writeText(text).then(()=>{
      const orig = copyBtn.textContent;
      copyBtn.textContent='Copied';
      setTimeout(()=>copyBtn.textContent=orig,1200);
    }).catch(()=>{});
  }
});

function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.navlink').forEach(a=>a.classList.remove('active'));
  const pageEl = document.getElementById('page-'+id);
  if(pageEl) pageEl.classList.add('active');
  if(id!=='doc-index'){
    expandSectionFor(id);
    const navEl = document.querySelector(`.navlink[data-id="${id}"]`);
    if(navEl){ navEl.classList.add('active'); navEl.scrollIntoView({block:'nearest'}); }
  }
  closeSidebar();
  location.hash = id;
}

/* ============ SEARCH (spans every document) ============ */
const results = document.getElementById('results');
const input = document.getElementById('searchInput');
const searchwrap = document.getElementById('searchwrap');

function stripHtml(html){
  const d = document.createElement('div');
  d.innerHTML = html;
  return d.textContent.replace(/\s+/g,' ').trim();
}
const INDEX = PAGES.map(p=>({
  id:p.id, book:p.book, group:p.group, title:p.title,
  bookLabel: docLabel(p.book),
  text:(p.title+' '+(p.dek||'')+' '+stripHtml(p.html)).toLowerCase()
}));

function doSearch(q){
  q = q.trim().toLowerCase();
  if(!q){ results.classList.remove('show'); results.innerHTML=''; searchwrap.classList.remove('has-val'); return; }
  searchwrap.classList.add('has-val');
  const hits = INDEX.filter(e=>e.text.includes(q)).slice(0,25);
  results.classList.add('show');
  if(!hits.length){ results.innerHTML = `<div class="none">No matches for "${escapeHtml(q)}"</div>`; return; }
  results.innerHTML = hits.map(h=>{
    const idx = h.text.indexOf(q);
    const start = Math.max(0, idx-28);
    const snippet = (start>0?'…':'') + escapeHtml(h.text.slice(start, idx+q.length+40)) + '…';
    const marked = snippet.replace(new RegExp(escapeRegExp(escapeHtml(q)),'i'), m=>`<b>${m}</b>`);
    return `<button class="rline" data-goto2="${h.id}"><span class="book">${h.bookLabel}</span><span>${h.title}</span><span class="path">${h.group||'Overview'} — ${marked}</span></button>`;
  }).join('');
}
function escapeHtml(s){return s.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function escapeRegExp(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

input.addEventListener('input', ()=>doSearch(input.value));
results.addEventListener('click', e=>{
  const btn = e.target.closest('[data-goto2]');
  if(btn){ go(btn.dataset.goto2); window.scrollTo({top:0}); input.value=''; doSearch(''); }
});
document.getElementById('clearSearch').addEventListener('click', ()=>{ input.value=''; doSearch(''); input.focus(); });

/* ============ MOBILE MENU ============ */
const sidebar = document.getElementById('sidebar');
const scrim = document.getElementById('scrim');
document.getElementById('menuBtn').addEventListener('click', ()=>{
  sidebar.classList.add('open'); scrim.classList.add('show');
});
function closeSidebar(){
  if(window.innerWidth<=860){ sidebar.classList.remove('open'); scrim.classList.remove('show'); }
}
scrim.addEventListener('click', closeSidebar);

/* ============ DESKTOP SIDEBAR COLLAPSE ============ */
document.getElementById('collapseBtn').addEventListener('click', ()=>{
  document.body.classList.add('sidebar-collapsed');
});
document.getElementById('expandTab').addEventListener('click', ()=>{
  document.body.classList.remove('sidebar-collapsed');
});

/* ============ Ctrl/Cmd+K TO FOCUS SEARCH ============ */
const isMac = /Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent||'');
document.getElementById('modKey').textContent = isMac ? '⌘' : 'Ctrl';
document.addEventListener('keydown', e=>{
  const key = e.key ? e.key.toLowerCase() : '';
  if((e.ctrlKey||e.metaKey) && key==='k'){
    e.preventDefault();
    input.focus();
    input.select();
  }
  if(e.key==='Escape' && document.activeElement===input){
    input.value=''; doSearch(''); input.blur();
  }
});

/* ============ INIT ============ */
renderNav();
const hash = (location.hash||'').replace('#','');
const startId = PAGES.some(p=>p.id===hash) ? hash : 'doc-index';
go(startId);
</script>
